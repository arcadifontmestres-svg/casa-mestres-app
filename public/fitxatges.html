<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fitxatges GPS</title><link rel="stylesheet" href="/styles.css"></head><body><main><div class="loginBox panel"><h1>FITXATGES GPS</h1><p>Consulta l’horari, les tasques i les anotacions amb el teu codi i PIN. El GPS només s’activa quan prems un botó de fitxatge.</p><div class="grid"><div><label>Codi d’empleat</label><input id="code" inputmode="numeric" placeholder="001"></div><div><label>PIN privat</label><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="••••"></div></div><div class="actions" style="margin-top:10px"><button type="button" class="btn secondary" id="scheduleBtn">Horari, tasques i anotacions</button></div><div id="schedule" style="margin-top:14px"></div><div class="punchGrid" style="margin-top:15px"><button class="btn punchBtn" data-type="ENTRADA">ENTRADA</button><button class="btn gold punchBtn" data-type="PAUSA">PAUSA</button><button class="btn secondary punchBtn" data-type="TORNAR">TORNAR</button><button class="btn bad punchBtn" data-type="SORTIDA">SORTIDA</button></div><div id="result" style="margin-top:14px"></div></div></main><script>
const result=document.getElementById('result'),schedule=document.getElementById('schedule'),code=document.getElementById('code'),pin=document.getElementById('pin');
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function mondayISO(){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toISOString().slice(0,10)}
function plus(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
async function loadSchedule(){const employeeCode=code.value.trim(),employeePin=pin.value.trim();if(!employeeCode||!employeePin)return alert('Escriu el codi i el PIN.');schedule.className='notice';schedule.textContent='Carregant horari...';try{const from=mondayISO(),to=plus(from,6),r=await fetch('/api/employee-schedule',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:employeeCode,pin:employeePin,from,to})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Error');const byDate=new Map(d.items.map(x=>[x.date,x]));const names=['Dl','Dt','Dc','Dj','Dv','Ds','Dg'];schedule.className='panel employeeSchedule';schedule.innerHTML='<h3>'+esc(d.employee.name)+(d.employee.level?' · '+esc(d.employee.level):'')+'</h3><div class="employeeWeek">'+names.map((name,i)=>{const date=plus(from,i),x=byDate.get(date);return '<div><b>'+name+' '+date.slice(5)+'</b><span>'+(x?esc((x.shiftCode?'Torn '+x.shiftCode+' · ':'')+x.start+'–'+x.end):'Descans')+'</span>'+(x?.area?'<small>'+esc(x.area)+'</small>':'')+'</div>'}).join('')+'</div><div class="employeeTasks"><h3>Tasques i responsabilitats</h3>'+(d.employee.tasks?'<p><b>Tasques:</b> '+esc(d.employee.tasks)+'</p>':'<p class="muted">Sense tasques assignades.</p>')+(d.employee.responsibilities?'<p><b>Responsabilitats:</b> '+esc(d.employee.responsibilities)+'</p>':'')+(d.employee.notes?'<p><b>Anotacions:</b> '+esc(d.employee.notes)+'</p>':'')+'</div>'}catch(e){schedule.className='errBox';schedule.textContent=e.message}}
const scheduleBtn=document.getElementById('scheduleBtn');scheduleBtn.addEventListener('click',event=>{event.preventDefault();loadSchedule()});pin.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();loadSchedule()}});
async function send(type,pos,error){try{const body={code:code.value.trim(),pin:pin.value.trim(),type};if(pos){body.lat=pos.coords.latitude;body.lng=pos.coords.longitude;body.accuracy=pos.coords.accuracy}else body.gpsError=error||'No disponible';const r=await fetch('/api/punch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');result.className='okBox';result.innerHTML='<b>'+d.punch.type+' registrada</b><br>'+d.punch.employeeName+'<br>'+d.punch.status+(d.punch.distance==null?'':' · '+d.punch.distance+' m');loadSchedule()}catch(e){result.className='errBox';result.textContent=e.message}}
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{const type=b.dataset.type;if(!code.value.trim()||!pin.value.trim())return alert('Escriu el codi i el PIN.');result.className='notice';result.textContent='Localitzant...';if(!navigator.geolocation)return send(type,null,'GPS no disponible');navigator.geolocation.getCurrentPosition(p=>send(type,p),e=>send(type,null,e.message),{enableHighAccuracy:true,timeout:10000,maximumAge:0})});
</script></body></html>
