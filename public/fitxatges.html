<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCADI · Horari i fitxatge</title><link rel="stylesheet" href="/styles.css"></head><body><main><div class="loginBox panel"><h1>ARCADI · PERSONAL</h1><div id="activation" hidden><p>Aquest mòbil encara no està vinculat. Introdueix les dades que t’ha enviat Direcció.</p><div class="grid"><div><label>Codi d’empleat</label><input id="employeeCode" inputmode="numeric" placeholder="001"></div><div><label>Codi d’activació</label><input id="activationCode" inputmode="numeric" maxlength="6" placeholder="000000"></div></div><button type="button" class="btn" id="activateBtn">Activar aquest mòbil</button><div id="activationResult" style="margin-top:12px"></div></div><div id="employeeApp" hidden><div id="identity" class="okBox"></div><p>Consulta l’horari, les tasques i les anotacions sense activar el GPS. El GPS només s’utilitza quan fitxes.</p><button type="button" class="btn secondary" id="scheduleBtn">Actualitzar horari, tasques i anotacions</button><div id="schedule" style="margin-top:14px"></div><div class="punchGrid" style="margin-top:15px"><button class="btn punchBtn" data-type="ENTRADA">ENTRADA</button><button class="btn gold punchBtn" data-type="PAUSA">PAUSA</button><button class="btn secondary punchBtn" data-type="TORNAR">TORNAR</button><button class="btn bad punchBtn" data-type="SORTIDA">SORTIDA</button></div><div id="result" style="margin-top:14px"></div></div></div></main><script>
const activation=document.getElementById('activation'),employeeApp=document.getElementById('employeeApp'),result=document.getElementById('result'),schedule=document.getElementById('schedule'),identity=document.getElementById('identity');
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function mondayISO(){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toISOString().slice(0,10)}
function plus(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
async function jsonFetch(path,options={}){const r=await fetch(path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Error '+r.status);return d}
async function checkSession(){try{const d=await jsonFetch('/api/device-session');activation.hidden=true;employeeApp.hidden=false;identity.innerHTML='<b>'+esc(d.employee.name)+'</b>'+(d.employee.level?' · '+esc(d.employee.level):'');await loadSchedule()}catch{employeeApp.hidden=true;activation.hidden=false}}
async function activateDevice(){const output=document.getElementById('activationResult'),code=document.getElementById('employeeCode').value.trim(),activationCode=document.getElementById('activationCode').value.trim();if(!code||!activationCode)return alert('Escriu el codi d’empleat i el codi d’activació.');output.className='notice';output.textContent='Activant...';try{await jsonFetch('/api/device-activate',{method:'POST',body:JSON.stringify({code,activationCode})});output.className='okBox';output.textContent='Mòbil activat correctament.';await checkSession()}catch(e){output.className='errBox';output.textContent=e.message}}
async function loadSchedule(){schedule.className='notice';schedule.textContent='Carregant horari...';try{const from=mondayISO(),to=plus(from,6),d=await jsonFetch('/api/employee-schedule',{method:'POST',body:JSON.stringify({from,to})}),byDate=new Map(d.items.map(x=>[x.date,x])),names=['Dl','Dt','Dc','Dj','Dv','Ds','Dg'];schedule.className='panel employeeSchedule';schedule.innerHTML='<h3>'+esc(d.employee.name)+(d.employee.level?' · '+esc(d.employee.level):'')+'</h3><div class="employeeWeek">'+names.map((name,i)=>{const date=plus(from,i),x=byDate.get(date);return '<div><b>'+name+' '+date.slice(5)+'</b><span>'+(x?esc((x.shiftCode?'Torn '+x.shiftCode+' · ':'')+x.start+'–'+x.end):'Descans')+'</span>'+(x?.area?'<small>'+esc(x.area)+'</small>':'')+(x?.notes?'<small>'+esc(x.notes)+'</small>':'')+'</div>'}).join('')+'</div><div class="employeeTasks"><h3>Tasques i responsabilitats</h3>'+(d.employee.tasks?'<p><b>Tasques:</b> '+esc(d.employee.tasks)+'</p>':'<p class="muted">Sense tasques assignades.</p>')+(d.employee.responsibilities?'<p><b>Responsabilitats:</b> '+esc(d.employee.responsibilities)+'</p>':'')+(d.employee.notes?'<p><b>Anotacions:</b> '+esc(d.employee.notes)+'</p>':'')+'</div>'}catch(e){schedule.className='errBox';schedule.textContent=e.message}}
async function send(type,pos,error){try{const body={type};if(pos){body.lat=pos.coords.latitude;body.lng=pos.coords.longitude;body.accuracy=pos.coords.accuracy}else body.gpsError=error||'No disponible';const d=await jsonFetch('/api/punch',{method:'POST',body:JSON.stringify(body)});result.className='okBox';result.innerHTML='<b>'+esc(d.punch.type)+' registrada</b><br>'+esc(d.punch.employeeName)+'<br>'+esc(d.punch.status)+(d.punch.distance==null?'':' · '+esc(d.punch.distance)+' m')}catch(e){result.className='errBox';result.textContent=e.message}}
document.getElementById('activateBtn').addEventListener('click',activateDevice);document.getElementById('scheduleBtn').addEventListener('click',loadSchedule);document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{result.className='notice';result.textContent='Localitzant...';if(!navigator.geolocation)return send(b.dataset.type,null,'GPS no disponible');navigator.geolocation.getCurrentPosition(p=>send(b.dataset.type,p),e=>send(b.dataset.type,null,e.message),{enableHighAccuracy:true,timeout:10000,maximumAge:0})});checkSession();
</script></body></html>
