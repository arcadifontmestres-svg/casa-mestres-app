<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Casa Mestres · Reserves</title>
  <style>
    :root{--wine:#7b1730;--cream:#f7f0e4;--gold:#b89554;--ink:#332b27;--line:#ddcfb7}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}
    .wrap{max-width:760px;margin:auto;padding:20px}.head{text-align:center;padding:18px 0 25px}
    .head h1{font-family:Georgia,serif;font-size:40px;margin:0;color:var(--wine)}.head p{letter-spacing:4px;color:var(--gold)}
    .card{background:#fffdf8;border:1px solid var(--line);border-radius:24px;padding:22px;margin-bottom:16px;box-shadow:0 12px 30px #5a442414}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;margin:12px 0 6px;color:#6a615b}
    input,select,textarea{width:100%;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fffaf2;font:inherit}
    .btn{width:100%;border:0;border-radius:16px;padding:16px;background:var(--wine);color:white;font-size:18px;font-weight:800;margin-top:16px;cursor:pointer}
    .btn:disabled{opacity:.55;cursor:not-allowed}.menuInfo,.notice{border-left:5px solid var(--gold);background:#f5ead8;padding:13px;border-radius:14px;margin-top:14px}
    .muted{color:#776e67;font-size:13px}.ok{background:#e5f2e8;border:1px solid #a8cdb0;padding:14px;border-radius:14px}.err{background:#f8e5e3;border:1px solid #d6a09b;padding:14px;border-radius:14px}
    @media(max-width:620px){.grid{grid-template-columns:1fr}.wrap{padding:12px}.head h1{font-size:34px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="head"><h1 id="brand">Casa Mestres</h1><p>CUINA D’AUTOR · RESERVES</p></header>
    <div id="app" class="card">Carregant…</div>
  </div>
  <script>
    let cfg=null;
    const euro=value=>(Number(value)||0).toFixed(2).replace('.',',')+' €';
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const localDate=()=>{const d=new Date(),offset=d.getTimezoneOffset();return new Date(d.getTime()-offset*60000).toISOString().slice(0,10)};

    async function api(path,options={}){
      const response=await fetch(path,{headers:{'Content-Type':'application/json'},...options});
      const text=await response.text();let data={};
      try{data=JSON.parse(text)}catch{}
      if(!response.ok)throw Error(data.error||'Error');
      return data;
    }

    function render(){
      const menus=cfg.menus||[],max=cfg.config.maxPax||10;
      document.getElementById('brand').textContent=cfg.company.name||'Casa Mestres';
      document.getElementById('app').innerHTML=`
        <h2>Reserva amb confirmació</h2><p>Selecciona dia, hora, comensals i menú.</p>
        <div class="grid">
          <div><label>Data</label><input id="date" type="date" min="${localDate()}" required></div>
          <div><label>Hora</label><select id="time"><option>13:30</option><option>14:00</option><option>14:30</option><option>20:30</option><option>21:00</option><option>21:30</option></select></div>
          <div><label>Persones</label><select id="pax">${Array.from({length:max},(_,i)=>`<option>${i+1}</option>`).join('')}</select></div>
          <div><label>Zona</label><select id="zone"><option>Sala principal</option><option>Terrassa</option></select></div>
        </div>
        <label>Menú / servei</label>
        <select id="menu">${menus.map(menu=>`<option value="${esc(menu.id)}">${esc(menu.title)} · ${euro(menu.price)}</option>`).join('')}</select>
        <div id="menuInfo" class="menuInfo"></div>
        <div class="notice">Per a més de <b>${max} persones</b>, reserva de grup. Contacta amb el restaurant: <b>${esc(cfg.config.groupPhone||cfg.company.phone||'')}</b>.</div>
        <hr>
        <label>Nom i cognoms</label><input id="name" autocomplete="name" required>
        <label>Telèfon / WhatsApp</label><input id="phone" inputmode="tel" autocomplete="tel" required>
        <label>Email</label><input id="email" type="email" autocomplete="email" required>
        <label>Observacions</label><textarea id="notes"></textarea>
        <label><input id="terms" type="checkbox" style="width:auto"> Accepto les condicions de reserva i cancel·lació.</label>
        <p class="muted">${esc(cfg.config.cancellationPolicy||'')}</p>
        <label><input id="marketing" type="checkbox" style="width:auto"> Accepto rebre comunicacions comercials. Opcional.</label>
        <button id="submit" class="btn" ${menus.length?'':'disabled'}>${menus.length?'Continuar al pagament':'No hi ha menús disponibles'}</button>
        <div id="result"></div>`;
      ['menu','pax'].forEach(id=>document.getElementById(id).addEventListener('change',update));
      document.getElementById('submit').onclick=submit;
      update();
    }

    function update(){
      const menu=cfg.menus.find(item=>item.id===document.getElementById('menu').value),pax=Number(document.getElementById('pax').value||1);
      if(!menu){document.getElementById('menuInfo').innerHTML='No hi ha menús publicats.';return}
      const deposit=menu.depositType==='percent'?menu.price*pax*(menu.depositValue||0)/100:pax*(menu.depositValue||0);
      document.getElementById('menuInfo').innerHTML=`<b>${esc(menu.title)}</b> · ${euro(menu.price)} per persona<br>Fiança calculada per ${pax} pax: <b>${euro(deposit)}</b>${menu.notes?`<p>${esc(menu.notes)}</p>`:''}`;
    }

    async function submit(){
      const out=document.getElementById('result'),get=id=>document.getElementById(id);
      out.className='';out.textContent='';
      if(!get('date').value||!get('name').value.trim()||!get('phone').value.trim()||!get('email').value.trim()){
        out.className='err';out.textContent='Completa la data, el nom, el telèfon i l’email.';return;
      }
      if(!get('terms').checked){out.className='err';out.textContent='Cal acceptar les condicions.';return}
      get('submit').disabled=true;get('submit').textContent='Preparant pagament…';
      try{
        const data=await api('/api/reservations',{method:'POST',body:JSON.stringify({
          date:get('date').value,time:get('time').value,pax:Number(get('pax').value),zone:get('zone').value,
          menuId:get('menu').value,name:get('name').value,phone:get('phone').value,email:get('email').value,
          notes:get('notes').value,marketing:get('marketing').checked,termsAccepted:get('terms').checked
        })});
        if(data.checkoutUrl){out.className='ok';out.innerHTML=`<b>Reserva creada.</b><br>Obrint el pagament segur de Stripe…<br>Fiança: <b>${euro(data.reservation.depositAmount)}</b>`;location.href=data.checkoutUrl;return}
        out.className='ok';out.innerHTML=`<b>Reserva confirmada.</b><br>${esc(data.message)}<br>Fiança: <b>${euro(data.reservation.depositAmount)}</b>`;
      }catch(error){out.className='err';out.textContent=error.message;get('submit').disabled=false;get('submit').textContent='Continuar al pagament'}
    }

    async function resumePayment(reservationId,token){
      const out=document.getElementById('resumeResult');out.className='notice';out.textContent='Preparant de nou el pagament…';
      try{const data=await api('/api/reservations/resume',{method:'POST',body:JSON.stringify({reservationId,token})});location.href=data.checkoutUrl}
      catch(error){out.className='err';out.textContent=error.message}
    }

    const query=new URLSearchParams(location.search);
    if(query.get('stripe')==='success'&&query.get('session_id')){
      document.getElementById('app').innerHTML='<div class="ok"><b>Comprovant pagament Stripe…</b></div>';
      api('/api/stripe/confirm?session_id='+encodeURIComponent(query.get('session_id'))).then(data=>{
        if(data.paid)document.getElementById('app').innerHTML=`<div class="ok"><h2>Reserva confirmada</h2><p>Pagament rebut correctament.</p><p><b>${esc(data.reservation.name)}</b> · ${esc(data.reservation.date)} ${esc(data.reservation.time)} · ${data.reservation.pax} pax</p><p>Fiança pagada: <b>${euro(data.reservation.depositAmount)}</b></p></div>`;
        else document.getElementById('app').innerHTML='<div class="err">Stripe encara no confirma el pagament. Contacta amb el restaurant abans de repetir-lo.</div>';
      }).catch(error=>document.getElementById('app').innerHTML=`<div class="err">${esc(error.message)}</div>`);
    }else if(query.get('stripe')==='cancel'){
      const reservationId=query.get('reservation_id')||'',token=query.get('token')||'';
      document.getElementById('app').innerHTML=`<div class="notice"><h2>Pagament no completat</h2><p>La reserva encara no està confirmada. Pots tornar al pagament segur sense crear una reserva duplicada.</p>${reservationId&&token?'<button id="resume" class="btn">Reprendre el pagament</button>':'<p>Contacta amb el restaurant per reprendre-la.</p>'}<div id="resumeResult"></div></div>`;
      if(reservationId&&token)document.getElementById('resume').onclick=()=>resumePayment(reservationId,token);
    }else{
      api('/api/reservation-config').then(data=>{cfg=data;render()}).catch(error=>document.getElementById('app').innerHTML=`<div class="err">${esc(error.message)}</div>`);
    }
  </script>
</body>
</html>
