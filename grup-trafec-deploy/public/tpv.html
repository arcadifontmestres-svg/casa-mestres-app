<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARCADI · TPV</title>
<style>
:root{font-family:Arial,sans-serif;color:#102b38;background:#eef3f5}*{box-sizing:border-box}body{margin:0;background:#eef3f5}
header{background:#0b2533;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:24px}.badge{background:#dff4ef;color:#126e59;padding:8px 12px;border-radius:999px;font-weight:800}
main{padding:20px;max-width:1500px;margin:auto}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px}
h1{margin:0;font-size:34px}.muted{color:#6b7d87}.panel{background:#fff;border:1px solid #d8e1e5;border-radius:18px;padding:18px;margin-bottom:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab,.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.tab{background:#e8eef1}.tab.active,.btn.primary{background:#1ea4a7;color:#fff}.btn.secondary{background:#e8eef1}.btn.bad{background:#8f2f2f;color:#fff}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.table{border:1px solid #d8e1e5;border-radius:16px;background:#fff;padding:18px;text-align:left;min-height:120px;cursor:pointer}.table.occupied{border-color:#1ea4a7;background:#f0fbfb}.table.bill{border-color:#c58d22;background:#fff8e8}.table b,.table strong{display:block}.table strong{font-size:24px;margin-bottom:8px}
.err{background:#fff0f0;border:1px solid #e3b3b3;color:#7d1d1d;padding:16px;border-radius:14px}.ok{background:#eef9f5;border:1px solid #b9dfd0;padding:14px;border-radius:14px}
.configZone{border:1px solid #d8e1e5;border-radius:16px;padding:16px;margin-top:14px}.zoneHead{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.tableLine{display:grid;grid-template-columns:1.4fr .7fr .7fr auto;gap:8px;margin-top:8px}
input{width:100%;padding:12px;border:1px solid #cbd5da;border-radius:10px;font-size:16px}
.modalBack{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px;z-index:20}.modal{background:#fff;width:min(1100px,96vw);max-height:94vh;overflow:auto;border-radius:18px;padding:18px}.orderGrid{display:grid;grid-template-columns:360px 1fr;gap:16px}
.ticket{border:1px solid #d8e1e5;border-radius:14px;padding:14px}.line{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #edf1f3}.prodGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.prod{border:1px solid #d8e1e5;border-radius:12px;background:#fff;padding:14px;text-align:left}.prod b{display:block}.familyBar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
@media(max-width:800px){.orderGrid{grid-template-columns:1fr}.tableLine{grid-template-columns:1fr 1fr}.tableLine button{grid-column:1/-1}}
</style>
</head>
<body>
<header><div><b>ARCADI GESTIÓ · FRONT OFFICE / TPV</b><div id="centreName"></div></div><span id="status" class="badge">VALIDANT</span></header>
<main>
<div class="top"><div><h1>TPV</h1><div class="muted">Configuració pròpia de cada centre</div></div><button class="btn secondary" onclick="location.href='/centre.html'">← Centre</button></div>
<div id="content"><div class="panel">Carregant...</div></div>
</main>
<script>
(()=>{
'use strict';
const TOKEN_KEY='arcadi_center_device_token_v1';
const token=localStorage.getItem(TOKEN_KEY)||'';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>(Number(v)||0).toLocaleString('ca-ES',{style:'currency',currency:'EUR'});
let state=null,zoneId='',order=null,family='',draftZones=[];

async function api(path,opt={}){
 const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json','X-Center-Device-Token':token,...(opt.headers||{})}});
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(d.error||'Error '+r.status);
 return d;
}
function uid(prefix){return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function orderTotal(o){return (o?.lines||[]).reduce((s,l)=>s+(Number(l.qty)||0)*(Number(l.price)||0),0)}
function activeOrder(zone,tableId){return (state.orders||[]).find(o=>o.zone===zone&&o.tableId===tableId&&o.status!=='closed')}
function allItems(){
 const dishes=(state.dishes||[])
   .filter(x=>x.active!==false&&x.onMenu!==false)
   .map(x=>({id:x.id,name:x.name,family:x.cat||x.category||'PLATS',type:'dish',price:Number(x.sale||x.price||0)}));
 const sale=(state.saleItems||[])
   .filter(x=>x.active!==false&&x.onMenu!==false)
   .map(x=>({id:x.id,name:x.name,family:x.family||'ALTRES',type:'sale',price:Number(x.sale||x.price||0)}));
 return [...dishes,...sale];
}
function render(){
 $('centreName').textContent=state.center?.name||'Centre';
 $('status').textContent='AUTORITZAT';
 if(!(state.config?.zones||[]).length)return renderConfig();
 if(!zoneId)zoneId=state.config.zones[0].id;
 const zone=state.config.zones.find(z=>z.id===zoneId)||state.config.zones[0];
 const open=(state.orders||[]).filter(o=>o.status!=='closed').length;
 $('content').innerHTML=
 '<div class="panel"><div class="tabs">'+state.config.zones.map(z=>'<button class="tab '+(z.id===zone.id?'active':'')+'" onclick="TPV.setZone(\''+esc(z.id)+'\')">'+esc(z.name)+'</button>').join('')+
 '<button class="btn secondary" onclick="TPV.config()">Configurar TPV</button><span style="margin-left:auto"><b>'+open+'</b> serveis oberts</span></div></div>'+
 '<div class="tables">'+(zone.tables||[]).map(t=>{const o=activeOrder(zone.id,t.id);return '<button class="table '+(o?'occupied ':'')+(o?.status==='bill'?'bill':'')+'" onclick="TPV.openTable(\''+esc(zone.id)+'\',\''+esc(t.id)+'\')"><strong>'+esc(t.name)+'</strong><span>'+t.min+'–'+t.max+' pax</span><b>'+(o?(o.status==='bill'?'COMPTE':o.status==='sent'?'ENVIADA':'OBERTA'):'LLIURE')+'</b>'+(o?'<small>'+o.pax+' pax · '+money(orderTotal(o))+'</small>':'')+'</button>'}).join('')+'</div>';
}
function renderConfig(){
 draftZones=JSON.parse(JSON.stringify(state.config?.zones||[]));
 drawConfig();
}
function drawConfig(){
 $('content').innerHTML='<div class="panel"><h2>Configurar TPV del centre</h2><p class="muted">Crea només les zones i taules reals d’aquest centre. No hi ha cap estructura predefinida.</p><div id="zonesEditor"></div><div style="display:flex;gap:10px;margin-top:16px"><button class="btn secondary" onclick="TPV.addZone()">+ Afegir zona</button><button class="btn primary" onclick="TPV.saveConfig()">Guardar configuració</button></div></div>';
 const host=$('zonesEditor');
 host.innerHTML=draftZones.map((z,zi)=>'<div class="configZone"><div class="zoneHead"><input value="'+esc(z.name)+'" oninput="TPV.renameZone('+zi+',this.value)" placeholder="Nom de la zona"><button class="btn bad" onclick="TPV.removeZone('+zi+')">Eliminar zona</button></div><div>'+(z.tables||[]).map((t,ti)=>'<div class="tableLine"><input value="'+esc(t.name)+'" oninput="TPV.renameTable('+zi+','+ti+',this.value)" placeholder="Nom taula"><input type="number" min="1" value="'+t.min+'" oninput="TPV.setTableMin('+zi+','+ti+',this.value)"><input type="number" min="1" value="'+t.max+'" oninput="TPV.setTableMax('+zi+','+ti+',this.value)"><button class="btn bad" onclick="TPV.removeTable('+zi+','+ti+')">Eliminar</button></div>').join('')+'</div><button class="btn secondary" style="margin-top:10px" onclick="TPV.addTable('+zi+')">+ Afegir taula</button></div>').join('');
}
async function saveConfig(){
 const clean=draftZones.map((z,zi)=>({id:z.id||uid('zone'),name:String(z.name||'').trim(),tables:(z.tables||[]).map(t=>({id:t.id||uid('table'),name:String(t.name||'').trim(),min:Math.max(1,Number(t.min)||1),max:Math.max(1,Number(t.max)||1)})).filter(t=>t.name)})).filter(z=>z.name);
 if(!clean.length)return alert('Cal crear almenys una zona.');
 await api('/api/tpv-center/config',{method:'PUT',body:JSON.stringify({zones:clean})});
 await boot();
}
async function openTable(zid,tid){
 const zone=state.config.zones.find(z=>z.id===zid),table=zone?.tables.find(t=>t.id===tid);if(!table)return;
 order=activeOrder(zid,tid);
 if(!order){
   order=await api('/api/tpv-center/orders',{method:'POST',body:JSON.stringify({zone:zid,tableId:tid,tableName:table.name,pax:table.min||1})});
   state.orders.push(order);
 }
 family='';renderOrder();
}
function renderOrder(){
 const items=allItems(),families=[...new Set(items.map(x=>x.family||'ALTRES'))];
 if(!family||!families.includes(family))family=families[0]||'';
 const visible=items.filter(x=>(x.family||'ALTRES')===family);
 const lines=(order.lines||[]).map((l,i)=>'<div class="line"><button onclick="TPV.qty('+i+',-1)">−</button><div><b>'+esc(l.name)+'</b><small>'+l.qty+' × '+money(l.price)+'</small></div><strong>'+money(l.qty*l.price)+'</strong><button onclick="TPV.qty('+i+',1)">+</button></div>').join('')||'<div class="muted">Comanda buida</div>';
 document.body.insertAdjacentHTML('beforeend','<div class="modalBack" id="modalBack"><div class="modal"><div class="top"><div><h2>'+esc(order.tableName)+'</h2><div class="muted">'+esc(order.pax)+' pax</div></div><button class="btn secondary" onclick="TPV.closeModal()">← Taules</button></div><div class="orderGrid"><div class="ticket">'+lines+'<div style="display:flex;justify-content:space-between;font-size:24px;margin-top:14px"><b>TOTAL</b><b>'+money(orderTotal(order))+'</b></div><div style="display:grid;gap:8px;margin-top:14px"><button class="btn primary" onclick="TPV.status(\'sent\')">ENVIAR CUINA</button><button class="btn secondary" onclick="TPV.status(\'bill\')">COMPTE</button><button class="btn bad" onclick="TPV.status(\'closed\')">TANCAR TAULA</button></div></div><div><div class="familyBar">'+families.map(f=>'<button class="tab '+(f===family?'active':'')+'" onclick="TPV.family(\''+esc(f).replace(/'/g,"\\'")+'\')">'+esc(f)+'</button>').join('')+'</div><div class="prodGrid">'+visible.map(x=>'<button class="prod" onclick="TPV.addItem(\''+x.type+'\',\''+esc(x.id)+'\',\''+esc(x.name).replace(/'/g,"\\'")+'\','+x.price+')"><b>'+esc(x.name)+'</b><span>'+money(x.price)+'</span></button>').join('')+'</div></div></div></div></div>');
}
async function persistOrder(){
 order=await api('/api/tpv-center/orders/'+encodeURIComponent(order.id),{method:'PUT',body:JSON.stringify(order)});
 const i=state.orders.findIndex(x=>x.id===order.id);if(i>=0)state.orders[i]=order;
}
async function boot(){
 try{state=await api('/api/tpv-center/bootstrap');render()}catch(e){$('status').textContent='BLOQUEJAT';$('content').innerHTML='<div class="err">'+esc(e.message)+'</div>'}
}
window.TPV={
 setZone:id=>{zoneId=id;render()},
 config:()=>renderConfig(),
 addZone:()=>{draftZones.push({id:uid('zone'),name:'',tables:[]});drawConfig()},
 removeZone:i=>{draftZones.splice(i,1);drawConfig()},
 renameZone:(i,v)=>draftZones[i].name=v,
 addTable:i=>{draftZones[i].tables=draftZones[i].tables||[];draftZones[i].tables.push({id:uid('table'),name:'',min:1,max:2});drawConfig()},
 removeTable:(zi,ti)=>{draftZones[zi].tables.splice(ti,1);drawConfig()},
 renameTable:(zi,ti,v)=>draftZones[zi].tables[ti].name=v,
 setTableMin:(zi,ti,v)=>draftZones[zi].tables[ti].min=Math.max(1,Number(v)||1),
 setTableMax:(zi,ti,v)=>draftZones[zi].tables[ti].max=Math.max(1,Number(v)||1),
 saveConfig,
 openTable,
 closeModal:()=>{document.getElementById('modalBack')?.remove();order=null;render()},
 family:f=>{family=f;document.getElementById('modalBack')?.remove();renderOrder()},
 addItem:async(type,id,name,price)=>{let l=(order.lines||[]).find(x=>x.type===type&&x.itemId===id);if(l)l.qty++;else(order.lines||(order.lines=[])).push({key:type+':'+id,type,itemId:id,name,qty:1,price:Number(price)||0});await persistOrder();document.getElementById('modalBack')?.remove();renderOrder()},
 qty:async(i,d)=>{if(!order.lines[i])return;order.lines[i].qty+=d;if(order.lines[i].qty<=0)order.lines.splice(i,1);await persistOrder();document.getElementById('modalBack')?.remove();renderOrder()},
 status:async st=>{order.status=st;await persistOrder();document.getElementById('modalBack')?.remove();order=null;render()}
};
boot();
})();
</script>
</body></html>
