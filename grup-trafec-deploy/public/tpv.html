<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARCADI · TPV</title>
<style>
:root{font-family:Arial,sans-serif;color:#102b38;background:#eef3f5}*{box-sizing:border-box}body{margin:0;background:#eef3f5}
header{background:#0b2533;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}header b{font-size:24px}
.badge{background:#dff4ef;color:#126e59;padding:8px 12px;border-radius:999px;font-weight:800}
main{padding:20px;max-width:1500px;margin:auto}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px}
h1{margin:0;font-size:34px}.muted{color:#6b7d87}.panel{background:#fff;border:1px solid #d8e1e5;border-radius:18px;padding:18px;margin-bottom:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab,.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.tab{background:#e8eef1}.tab.active,.btn.primary{background:#1ea4a7;color:#fff}.btn.secondary{background:#e8eef1}.btn.bad{background:#8f2f2f;color:#fff}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.table{border:1px solid #d8e1e5;border-radius:16px;background:#fff;padding:18px;text-align:left;min-height:120px;cursor:pointer}.table.occupied{border-color:#1ea4a7;background:#f0fbfb}.table.bill{border-color:#c58d22;background:#fff8e8}
.table strong{display:block;font-size:24px;margin-bottom:8px}.err{background:#fff0f0;border:1px solid #e3b3b3;color:#7d1d1d;padding:16px;border-radius:14px}
.configZone{border:1px solid #d8e1e5;border-radius:16px;padding:16px;margin-top:14px}.zoneHead{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.tableLine{display:grid;grid-template-columns:1.4fr .7fr .7fr auto;gap:8px;margin-top:8px}
input,textarea,select{width:100%;padding:12px;border:1px solid #cbd5da;border-radius:10px;font-size:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}
.modalBack{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px;z-index:20}.modal{background:#fff;width:min(1180px,96vw);max-height:94vh;overflow:auto;border-radius:18px;padding:18px}
.orderGrid{display:grid;grid-template-columns:390px 1fr;gap:16px}.ticket{border:1px solid #d8e1e5;border-radius:14px;padding:14px}.line{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #edf1f3}.line small{display:block}.note{display:block;color:#8a5b00;font-size:12px}
.prodGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.prod{border:1px solid #d8e1e5;border-radius:12px;background:#fff;padding:10px;text-align:left;min-height:118px;display:flex;flex-direction:column;justify-content:flex-end;background-size:cover;background-position:center;overflow:hidden}.prod .prodText{background:#fffffff0;border-radius:9px;padding:8px}.prod b{display:block}.familyBar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pax{display:flex;align-items:center;gap:8px}.pax input{width:90px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid #d8e1e5;border-radius:14px;padding:14px}
@media(max-width:800px){.orderGrid,.grid2,.summary{grid-template-columns:1fr}.tableLine{grid-template-columns:1fr 1fr}.tableLine button{grid-column:1/-1}}
</style></head>
<body>
<header><div><b>ARCADI GESTIÓ · FRONT OFFICE / TPV</b><div id="centreName"></div></div><span id="status" class="badge">VALIDANT</span></header>
<main>
<div class="top"><div><h1>TPV</h1><div class="muted">Miniapp autònoma del centre</div></div><button class="btn secondary" onclick="location.href='/centre.html'">← Centre</button></div>
<div id="content"><div class="panel">Carregant...</div></div>
</main>
<script>
(()=>{'use strict';
const TOKEN_KEY='arcadi_center_device_token_v1',SESSION_KEY='arcadi_direction_center_token_v1',params=new URLSearchParams(location.search),incoming=params.get('direction_token')||'',token=incoming||localStorage.getItem(TOKEN_KEY)||sessionStorage.getItem(SESSION_KEY)||'';if(incoming)sessionStorage.setItem(SESSION_KEY,incoming);
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>(Number(v)||0).toLocaleString('ca-ES',{style:'currency',currency:'EUR'});
let state=null,zoneId='',order=null,family='',draftZones=[];
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json','X-Center-Device-Token':token,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Error '+r.status);return d}
function uid(p){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function orderTotal(o){return(o?.lines||[]).reduce((s,l)=>s+(Number(l.qty)||0)*(Number(l.price)||0),0)}
function activeOrder(z,t){return(state.orders||[]).find(o=>o.zone===z&&o.tableId===t&&o.status!=='closed')}
function items(){
 const norm=(a,type)=>(a||[]).filter(x=>x.active!==false).map(x=>({id:x.id,name:x.name,family:x.family||x.cat||x.category||'ALTRES',type,price:Number(x.price||x.sale||0),image:x.image||'',buttonColor:x.buttonColor||''}));
 return[...norm(state.dishes,'dish'),...norm(state.saleItems,'sale'),...norm(state.products,'product')];
}
function render(){
 $('centreName').textContent=state.center?.name||'Centre';$('status').textContent=state.persistent?'AUTORITZAT · PERSISTENT':'AUTORITZAT';
 if(!(state.config?.zones||[]).length)return config();
 if(!zoneId)zoneId=state.config.zones[0].id;
 const zone=state.config.zones.find(z=>z.id===zoneId)||state.config.zones[0],open=(state.orders||[]).filter(o=>o.status!=='closed').length;
 $('content').innerHTML='<div class="panel"><div class="tabs">'+state.config.zones.map(z=>'<button class="tab '+(z.id===zone.id?'active':'')+'" onclick="TPV.zone(\''+esc(z.id)+'\')">'+esc(z.name)+'</button>').join('')+
 '<button class="btn secondary" onclick="location.href=\'/tpv-back.html\'">TPV BACK</button><span style="margin-left:auto"><b>'+open+'</b> serveis oberts</span></div></div>'+
 '<div class="tables">'+(zone.tables||[]).map(t=>{const o=activeOrder(zone.id,t.id);return'<button class="table '+(o?'occupied ':'')+(o?.status==='bill'?'bill':'')+'" onclick="TPV.open(\''+esc(zone.id)+'\',\''+esc(t.id)+'\')"><strong>'+esc(t.name)+'</strong><span>'+t.min+'–'+t.max+' pax</span><b>'+(o?(o.status==='bill'?'COMPTE':o.status==='sent'?'ENVIADA':'OBERTA'):'LLIURE')+'</b>'+(o?'<small>'+o.pax+' pax · '+money(orderTotal(o))+'</small>':'')+'</button>'}).join('')+'</div>';
}
function config(){draftZones=JSON.parse(JSON.stringify(state.config?.zones||[]));drawConfig()}
function drawConfig(){
 const b=state.config?.business||{},p=state.config?.printer||{};
 $('content').innerHTML='<div class="panel"><h2>Zones i taules</h2><div id="zones"></div><button class="btn secondary" style="margin-top:12px" onclick="TPV.addZone()">+ Zona</button></div>'+
 '<div class="panel"><h2>Dades del tiquet client</h2><div class="grid2"><div><label>Nom</label><input id="bn" value="'+esc(b.name||state.center?.name||'')+'"></div><div><label>NIF/CIF</label><input id="tax" value="'+esc(b.taxId||'')+'"></div><div class="wide"><label>Adreça</label><input id="addr" value="'+esc(b.address||'')+'"></div><div><label>Telèfon</label><input id="phone" value="'+esc(b.phone||'')+'"></div><div><label>IVA %</label><input id="vatRate" type="number" min="0" max="30" step="0.01" value="'+Number(b.vatRate||10)+'"></div><div><label>Logo</label><input id="logo" type="file" accept="image/*"></div><div class="wide"><label>Peu del tiquet</label><textarea id="footer">'+esc(b.receiptFooter||'')+'</textarea></div></div></div>'+
 '<div class="panel"><h2>Impressora tiquet client</h2><div class="grid2"><div><label>Paper</label><select id="paper"><option value="80" '+(String(p.paperWidth||'80')==='80'?'selected':'')+'>80 mm</option><option value="58" '+(String(p.paperWidth)==='58'?'selected':'')+'>58 mm</option></select></div><div><label>Impressora</label><input id="printer" value="'+esc(p.printerName||'')+'"></div><div><label><input id="auto" type="checkbox" style="width:auto" '+(p.autoPrint?'checked':'')+'> imprimir automàticament</label></div><div><button class="btn secondary" onclick="TPV.testPrint()">Prova tiquet client</button></div></div></div>'+
 '<div class="panel"><h2>Impressora cuina</h2><div class="grid2"><div><label>Paper</label><select id="kpaper"><option value="80" '+(String(state.config?.kitchenPrinter?.paperWidth||'80')==='80'?'selected':'')+'>80 mm</option><option value="58" '+(String(state.config?.kitchenPrinter?.paperWidth)==='58'?'selected':'')+'>58 mm</option></select></div><div><label>Impressora cuina</label><input id="kprinter" value="'+esc(state.config?.kitchenPrinter?.printerName||'')+'"></div><div><label><input id="kauto" type="checkbox" style="width:auto" '+(state.config?.kitchenPrinter?.autoPrint===false?'':'checked')+'> imprimir comanda en enviar a cuina</label></div><div><button class="btn secondary" onclick="TPV.testKitchen()">Prova tiquet cuina</button></div></div></div>'+
 '<div class="panel"><button class="btn primary" onclick="TPV.saveConfig()">Guardar configuració</button></div>';
 $('zones').innerHTML=draftZones.map((z,zi)=>'<div class="configZone"><div class="zoneHead"><input value="'+esc(z.name)+'" oninput="TPV.rz('+zi+',this.value)"><button class="btn bad" onclick="TPV.dz('+zi+')">Eliminar zona</button></div>'+(z.tables||[]).map((t,ti)=>'<div class="tableLine"><input value="'+esc(t.name)+'" oninput="TPV.rt('+zi+','+ti+',this.value)"><input type="number" min="1" value="'+t.min+'" oninput="TPV.tmin('+zi+','+ti+',this.value)"><input type="number" min="1" value="'+t.max+'" oninput="TPV.tmax('+zi+','+ti+',this.value)"><button class="btn bad" onclick="TPV.dt('+zi+','+ti+')">Eliminar</button></div>').join('')+'<button class="btn secondary" style="margin-top:10px" onclick="TPV.addTable('+zi+')">+ Taula</button></div>').join('');
}
async function saveConfig(){
 const zones=draftZones.map(z=>({id:z.id||uid('zone'),name:String(z.name||'').trim(),tables:(z.tables||[]).map(t=>({id:t.id||uid('table'),name:String(t.name||'').trim(),min:Math.max(1,Number(t.min)||1),max:Math.max(1,Number(t.max)||1)})).filter(t=>t.name)})).filter(z=>z.name);
 if(!zones.length)return alert('Cal almenys una zona.');
 let logo=state.config?.business?.logo||'';const file=$('logo')?.files?.[0];if(file)logo=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result||''));r.onerror=no;r.readAsDataURL(file)});
 await api('/api/tpv-center/config',{method:'PUT',body:JSON.stringify({zones,business:{name:$('bn').value.trim(),taxId:$('tax').value.trim(),address:$('addr').value.trim(),phone:$('phone').value.trim(),logo,receiptFooter:$('footer').value.trim(),vatRate:Number($('vatRate').value||10)},printer:{paperWidth:$('paper').value,printerName:$('printer').value.trim(),autoPrint:$('auto').checked},kitchenPrinter:{paperWidth:$('kpaper').value,printerName:$('kprinter').value.trim(),autoPrint:$('kauto').checked}})});
 await boot();
}
async function openTable(zid,tid){
 const zone=state.config.zones.find(z=>z.id===zid),table=zone?.tables.find(t=>t.id===tid);if(!table)return;
 order=activeOrder(zid,tid);
 if(!order){order=await api('/api/tpv-center/orders',{method:'POST',body:JSON.stringify({zone:zid,tableId:tid,tableName:table.name,pax:table.min||1})});state.orders.push(order)}
 family='';renderOrder();
}
function renderOrder(){
 const all=items(),families=[...new Set(all.map(x=>x.family||'ALTRES'))];if(!family||!families.includes(family))family=families[0]||'';
 const visible=all.filter(x=>(x.family||'ALTRES')===family);
 const lines=(order.lines||[]).map((l,i)=>'<div class="line"><button onclick="TPV.qty('+i+',-1)">−</button><div><b>'+esc(l.name)+'</b><small>'+l.qty+' × '+money(l.price)+'</small>'+(l.notes?'<span class="note">'+esc(l.notes)+'</span>':'')+'</div><strong>'+money(l.qty*l.price)+'</strong><div><button onclick="TPV.qty('+i+',1)">+</button><button class="btn secondary" style="padding:6px;margin-left:4px" onclick="TPV.note('+i+')">Obs.</button></div></div>').join('')||'<div class="muted">Comanda buida</div>';
 document.getElementById('modalBack')?.remove();
 document.body.insertAdjacentHTML('beforeend','<div class="modalBack" id="modalBack"><div class="modal"><div class="top"><div><h2>'+esc(order.tableName)+'</h2><div class="pax"><label>Comensals</label><input type="number" min="1" value="'+order.pax+'" onchange="TPV.pax(this.value)"></div></div><button class="btn secondary" onclick="TPV.close()">← Taules</button></div><div class="orderGrid"><div class="ticket">'+lines+'<div style="display:flex;justify-content:space-between;font-size:24px;margin-top:14px"><b>TOTAL</b><b>'+money(orderTotal(order))+'</b></div><div style="display:grid;gap:8px;margin-top:14px"><button class="btn primary" onclick="TPV.kitchen()">ENVIAR CUINA</button><button class="btn secondary" onclick="TPV.bill()">COMPTE</button><button class="btn primary" onclick="TPV.pay()">COBRAR</button></div></div><div><div class="familyBar">'+families.map(f=>'<button class="tab '+(f===family?'active':'')+'" onclick="TPV.family(\''+esc(f).replace(/'/g,"\\'")+'\')">'+esc(f)+'</button>').join('')+'</div><div class="prodGrid">'+visible.map(x=>'<button class="prod" style="'+(x.image?'background-image:url(&quot;'+esc(x.image)+'&quot;);':'')+(x.buttonColor?'background-color:'+esc(x.buttonColor)+';':'')+'" onclick="TPV.add(\''+x.type+'\',\''+esc(x.id)+'\',\''+esc(x.name).replace(/'/g,"\\'")+'\','+x.price+')"><span class="prodText"><b>'+esc(x.name)+'</b><span>'+money(x.price)+'</span></span></button>').join('')+'</div></div></div></div></div>');
}
async function persist(){order=await api('/api/tpv-center/orders/'+encodeURIComponent(order.id),{method:'PUT',body:JSON.stringify(order)});const i=state.orders.findIndex(x=>x.id===order.id);if(i>=0)state.orders[i]=order}
function printWindow(html){
 const win=window.open('','_blank','width=440,height=760');if(!win)return alert('Finestra d’impressió bloquejada.');
 win.document.write(html);win.document.close();
}
function ticketDocument(ticket,{provisional=false}={}){
 const b=ticket.business||state.config?.business||{};
 const p=state.config?.printer||{};
 const w=String(p.paperWidth||'80')==='58'?'58mm':'80mm';
 const vatRate=Number(ticket.vatRate??b.vatRate??10);
 const total=Number(ticket.total||0);
 const base=Number(ticket.baseAmount??(total/(1+vatRate/100)));
 const vat=Number(ticket.vatAmount??(total-base));
 const rows=(ticket.lines||[]).map(l=>{
   const lineTotal=(Number(l.qty)||0)*(Number(l.price)||0);
   return '<tr><td class="desc"><b>'+esc(l.qty)+' × '+esc(l.name)+'</b>'+(l.notes?'<div class="obs">'+esc(l.notes)+'</div>':'')+'</td><td class="amt">'+money(lineTotal)+'</td></tr>';
 }).join('');
 const title=provisional?'COMPTE':'TIQUET';
 const numberLine=provisional?'':'<div class="ticketNo">Núm. '+esc(ticket.number||'')+'</div>';
 const payment=provisional?'':'<tr><td>Pagament</td><td class="amt">'+esc(ticket.paymentMethod||'')+'</td></tr>';
 return '<!doctype html><html><head><meta charset="utf-8"><title>'+title+'</title><style>'+
 '@page{size:'+w+' auto;margin:0}*{box-sizing:border-box}html,body{margin:0;padding:0;width:'+w+';background:#fff;color:#000}'+
 'body{font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:1.25;padding:3mm}'+
 '.brand{text-align:center;font-size:20px;font-weight:800;letter-spacing:.4px;margin:0 0 2px}.logo{display:block;max-width:52mm;max-height:18mm;margin:0 auto 2mm}.center{text-align:center}.small{font-size:10px}.doc{font-size:14px;font-weight:800;text-align:center;margin:7px 0 2px}.ticketNo{text-align:center;font-weight:700;margin-bottom:5px}'+
 '.rule{border:0;border-top:1px solid #000;margin:5px 0}table{width:100%;border-collapse:collapse}td{padding:3px 0;vertical-align:top}.desc{padding-right:5px}.amt{text-align:right;white-space:nowrap}.obs{font-weight:700;font-size:10px;margin-top:1px}.totals td{padding:2px 0}.grand td{font-size:15px;font-weight:800;border-top:1px solid #000;padding-top:5px}.footer{text-align:center;font-size:10px;margin-top:7px;white-space:pre-wrap}'+
 '</style></head><body>'+
 (b.logo?'<img class="logo" src="'+b.logo+'">':'')+
 '<div class="brand">'+esc(b.name||state.center?.name||'SARRIERA 1930')+'</div>'+
 (b.taxId?'<div class="center small">NIF/CIF '+esc(b.taxId)+'</div>':'')+
 (b.address?'<div class="center small">'+esc(b.address)+'</div>':'')+
 (b.phone?'<div class="center small">Tel. '+esc(b.phone)+'</div>':'')+
 '<hr class="rule"><div class="doc">'+title+'</div>'+numberLine+
 '<div class="center small">'+esc(new Date(ticket.createdAt||Date.now()).toLocaleString('ca-ES'))+'</div>'+
 '<div class="center small">Taula '+esc(ticket.tableName||'')+' · '+esc(ticket.pax||'')+' pax</div>'+
 '<hr class="rule"><table>'+rows+'</table><hr class="rule">'+
 '<table class="totals"><tr><td>Base imposable</td><td class="amt">'+money(base)+'</td></tr><tr><td>IVA '+vatRate+'%</td><td class="amt">'+money(vat)+'</td></tr><tr class="grand"><td>TOTAL</td><td class="amt">'+money(total)+'</td></tr>'+payment+'</table>'+
 (provisional?'<div class="center small" style="margin-top:6px">DOCUMENT PROVISIONAL · NO ÉS TIQUET FISCAL</div>':'')+
 (b.receiptFooter?'<div class="footer">'+esc(b.receiptFooter)+'</div>':'')+
 '<script>window.onload=()=>{window.focus();window.print()}<\/script></body></html>';
}
function receiptHtml(ticket){return ticketDocument(ticket,{provisional:false})}
function billHtml(order){
 const total=orderTotal(order),b=state.config?.business||{},vatRate=Number(b.vatRate||10),base=total/(1+vatRate/100),vat=total-base;
 return ticketDocument({business:b,createdAt:new Date().toISOString(),tableName:order.tableName,pax:order.pax,lines:order.lines||[],total,baseAmount:base,vatAmount:vat,vatRate},{provisional:true});
}
function printBill(){
 if(!(order?.lines||[]).length)return alert('La comanda és buida.');
 order.status='bill';
 return persist().then(()=>{
   const h=billHtml(order);
   printWindow(h);
   renderOrder();
 }).catch(e=>alert(e.message||'No s’ha pogut preparar el compte.'));
}
function receipt(ticket,win=null){
 const h=receiptHtml(ticket);
 if(win){win.document.write(h);win.document.close();return}
 printWindow(h);
}
function kitchenReceipt(data){
 const p=state.config?.kitchenPrinter||{},w=String(p.paperWidth||'80')==='58'?'58mm':'80mm';
 const rows=(data.lines||[]).map(l=>'<div style="padding:8px 0;border-bottom:1px dashed #000"><b style="font-size:20px">'+esc(l.qty)+' × '+esc(l.name)+'</b>'+(l.notes?'<div style="font-size:18px;font-weight:bold">*** '+esc(l.notes)+' ***</div>':'')+'</div>').join('');
 const h='<!doctype html><html><head><meta charset="utf-8"><style>@page{size:'+w+' auto;margin:3mm}html,body{margin:0;padding:0;width:auto;max-width:100%}body{font-family:Arial,sans-serif;box-sizing:border-box;color:#000;overflow:visible}h1,h2,p{margin:4px 0}.head{text-align:center;border-bottom:2px solid #000;padding-bottom:8px}.big{font-size:28px;font-weight:bold}</style></head><body><div class="head"><div class="big">CUINA</div><h1>TAULA '+esc(data.tableName||'')+'</h1><h2>'+esc(data.pax||'')+' PAX</h2><p>'+esc(new Date(data.sentAt||Date.now()).toLocaleTimeString('ca-ES',{hour:'2-digit',minute:'2-digit'}))+' · enviament '+esc(data.printNumber||1)+'</p></div>'+rows+'<script>window.onload=()=>window.print()<\/script></body></html>';
 printWindow(h);
}
async function sendKitchen(){
 if(!(order.lines||[]).length)return alert('La comanda és buida.');
 let printWin=null;
 if(state.config?.kitchenPrinter?.autoPrint!==false){
   printWin=window.open('','_blank','width=440,height=760');
   if(!printWin) alert('El navegador ha bloquejat la finestra d’impressió de cuina.');
 }
 try{
   const d=await api('/api/tpv-center/orders/'+encodeURIComponent(order.id)+'/kitchen',{method:'POST',body:'{}'});
   order.status='sent';order.kitchenSentAt=d.sentAt;order.kitchenPrintCount=d.printNumber;
   if(!(d.lines||[]).length){if(printWin)printWin.close();alert('Aquesta comanda no té cap article marcat per imprimir a CUINA. Revisa TPV BACK → CATÀLEG / BOTONS.');renderOrder();return;}
   const i=state.orders.findIndex(x=>x.id===order.id);if(i>=0)state.orders[i]=order;
   if(printWin){
     const p=state.config?.kitchenPrinter||{},w=String(p.paperWidth||'80')==='58'?'58mm':'80mm';
     const rows=(d.lines||[]).map(l=>'<div style="padding:8px 0;border-bottom:1px dashed #000"><b style="font-size:20px">'+esc(l.qty)+' × '+esc(l.name)+'</b>'+(l.notes?'<div style="font-size:18px;font-weight:bold">*** '+esc(l.notes)+' ***</div>':'')+'</div>').join('');
     const h='<!doctype html><html><head><meta charset="utf-8"><style>@page{size:'+w+' auto;margin:3mm}html,body{margin:0;padding:0;width:auto;max-width:100%}body{font-family:Arial,sans-serif;box-sizing:border-box;color:#000;overflow:visible}h1,h2,p{margin:4px 0}.head{text-align:center;border-bottom:2px solid #000;padding-bottom:8px}.big{font-size:28px;font-weight:bold}</style></head><body><div class="head"><div class="big">CUINA</div><h1>TAULA '+esc(d.tableName||'')+'</h1><h2>'+esc(d.pax||'')+' PAX</h2><p>'+esc(new Date(d.sentAt||Date.now()).toLocaleTimeString('ca-ES',{hour:'2-digit',minute:'2-digit'}))+' · enviament '+esc(d.printNumber||1)+'</p></div>'+rows+'<script>window.onload=()=>window.print()<\/script></body></html>';
     printWin.document.write(h);printWin.document.close();
   }
   renderOrder();
 }catch(e){
   if(printWin)printWin.close();
   alert(e.message||'Error enviant a cuina.');
 }
}
async function backoffice(from='',to=''){
 const q=new URLSearchParams();if(from)q.set('from',from);if(to)q.set('to',to);
 const d=await api('/api/tpv-center/backoffice'+(q.toString()?'?'+q.toString():''));
 const s=d.summary||{},by=s.byPayment||{},open=d.openCash;
 $('content').innerHTML='<div class="panel"><div class="top"><h2>CAIXA I VENDES</h2><button class="btn secondary" onclick="TPV.home()">← TPV</button></div>'+
 '<div class="summary"><div class="stat"><b>Caixa</b><div style="font-size:22px">'+(open?'OBERTA':'TANCADA')+'</div>'+(open?'<small>Fons: '+money(open.openingAmount)+'</small>':'')+'</div><div class="stat"><b>Venda</b><div style="font-size:22px">'+money(s.total||0)+'</div></div><div class="stat"><b>Tiquets</b><div style="font-size:22px">'+Number(s.ticketCount||0)+'</div><small>Mitjà '+money(s.averageTicket||0)+'</small></div><div class="stat"><b>Efectiu</b><div style="font-size:22px">'+money(by.EFECTIU||0)+'</div><small>Targeta '+money(by.VISA||0)+' · Bizum '+money(by.BIZUM||0)+'</small></div></div>'+
 '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn primary" onclick="TPV.openCash()">OBRIR CAIXA</button><button class="btn bad" onclick="TPV.closeCash()">TANCAR CAIXA</button><button class="btn secondary" onclick="location.href=\'/tpv-direccio.html\'">CATÀLEG / BOTONS</button></div></div>'+
 '<div class="panel"><h3>Resum de vendes</h3><div class="grid2"><div><label>Des de</label><input id="salesFrom" type="date" value="'+esc(from)+'"></div><div><label>Fins</label><input id="salesTo" type="date" value="'+esc(to)+'"></div></div><button class="btn secondary" style="margin-top:10px" onclick="TPV.filterSales()">Aplicar filtre</button></div>'+
 '<div class="panel"><h3>Llistat de tiquets</h3><div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th>Data</th><th>Núm.</th><th>Taula</th><th>Pax</th><th>Pagament</th><th>Total</th><th></th></tr></thead><tbody>'+((d.tickets||[]).slice().reverse().map((t,i)=>'<tr style="border-bottom:1px solid #eee"><td>'+esc(new Date(t.createdAt).toLocaleString('ca-ES'))+'</td><td><b>'+esc(t.number)+'</b></td><td>'+esc(t.tableName||'')+'</td><td>'+esc(t.pax||'')+'</td><td>'+esc(t.paymentMethod||'')+'</td><td><b>'+money(t.total)+'</b></td><td><button class="btn secondary" onclick="TPV.reprint('+i+')">Reimprimir</button></td></tr>').join('')||'<tr><td colspan="7">Sense tiquets.</td></tr>')+'</tbody></table></div></div>';
 window.__tpvTickets=(d.tickets||[]).slice().reverse();
}

async function boot(){try{state=await api('/api/tpv-center/bootstrap');render()}catch(e){$('status').textContent='BLOQUEJAT';$('content').innerHTML='<div class="err">'+esc(e.message)+'</div>'}}
window.TPV={
 zone:id=>{zoneId=id;render()},config,home:()=>render(),backoffice,cash:()=>backoffice(),sales:()=>backoffice(),
 addZone:()=>{draftZones.push({id:uid('zone'),name:'',tables:[]});drawConfig()},dz:i=>{draftZones.splice(i,1);drawConfig()},rz:(i,v)=>draftZones[i].name=v,
 addTable:i=>{draftZones[i].tables=draftZones[i].tables||[];draftZones[i].tables.push({id:uid('table'),name:'',min:1,max:2});drawConfig()},dt:(zi,ti)=>{draftZones[zi].tables.splice(ti,1);drawConfig()},
 rt:(zi,ti,v)=>draftZones[zi].tables[ti].name=v,tmin:(zi,ti,v)=>draftZones[zi].tables[ti].min=Math.max(1,Number(v)||1),tmax:(zi,ti,v)=>draftZones[zi].tables[ti].max=Math.max(1,Number(v)||1),
 saveConfig,open:openTable,close:()=>{document.getElementById('modalBack')?.remove();order=null;render()},family:f=>{family=f;renderOrder()},
 add:async(type,id,name,price)=>{let l=(order.lines||[]).find(x=>x.type===type&&x.itemId===id&&!(x.notes||''));if(l)l.qty++;else(order.lines||(order.lines=[])).push({key:type+':'+id+':'+Date.now(),type,itemId:id,name,qty:1,price:Number(price)||0,notes:''});await persist();renderOrder()},
 qty:async(i,d)=>{if(!order.lines[i])return;order.lines[i].qty+=d;if(order.lines[i].qty<=0)order.lines.splice(i,1);await persist();renderOrder()},
 note:async i=>{if(!order.lines[i])return;const v=prompt('Observacions: sense sal, sense salsa, poc fet, al punt, fet...',order.lines[i].notes||'');if(v===null)return;order.lines[i].notes=v.trim();await persist();renderOrder()},
 pax:async v=>{order.pax=Math.max(1,Number(v)||1);await persist()},
 status:async s=>{order.status=s;await persist();renderOrder()},
 kitchen:sendKitchen,
 bill:printBill,
 pay:async()=>{try{const bo=await api('/api/tpv-center/backoffice');if(!bo.openCash)return alert('CAL OBRIR CAIXA ABANS DE COBRAR. Ves a TPV BACK → CAIXA.')}catch(e){return alert(e.message||'No puc comprovar la caixa.')}const method=(prompt('Forma de cobrament: EFECTIU, VISA, BIZUM o ALTRES','VISA')||'').trim().toUpperCase();if(!method)return;let printWin=null;if(state.config?.printer?.autoPrint!==false){printWin=window.open('','_blank','width=440,height=760');if(!printWin)alert('El navegador ha bloquejat la finestra del tiquet client.');}try{const t=await api('/api/tpv-center/payments',{method:'POST',body:JSON.stringify({orderId:order.id,paymentMethod:method})});if(printWin)receipt(t,printWin);else receipt(t);document.getElementById('modalBack')?.remove();order=null;await boot()}catch(e){if(printWin)printWin.close();alert(e.message||'Error en el cobrament.')}},
 openCash:async()=>{const a=Number(prompt('Fons inicial de caixa','0')||0);await api('/api/tpv-center/cash/open',{method:'POST',body:JSON.stringify({openingAmount:a})});await backoffice()},
 closeCash:async()=>{const a=Number(prompt('Import comptat al tancament','0')||0);const d=await api('/api/tpv-center/cash/close',{method:'POST',body:JSON.stringify({closingAmount:a})});alert('Caixa tancada. Esperat: '+money(d.expectedCash||0)+' · Comptat: '+money(d.closingAmount||0)+' · Diferència: '+money(d.cashDifference||0));await backoffice()},
 filterSales:()=>backoffice($('salesFrom')?.value||'',$('salesTo')?.value||''),
 reprint:i=>{const t=(window.__tpvTickets||[])[i];if(t)receipt(t)},
 testPrint:()=>receipt({number:'PROVA',createdAt:new Date().toISOString(),tableName:'PROVA',pax:2,total:11,baseAmount:10,vatAmount:1,vatRate:10,paymentMethod:'VISA',business:state.config?.business||{},lines:[{name:'Article prova',qty:1,price:11,notes:''}]}),
 testKitchen:()=>kitchenReceipt({tableName:'PROVA',pax:2,sentAt:new Date().toISOString(),printNumber:1,lines:[{name:'Entrecot',qty:2,price:0,notes:'un al punt, un poc fet'}]})
};
boot();
})();
