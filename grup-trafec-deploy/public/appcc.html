<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCADI · APPCC</title><style>
:root{font-family:Arial,sans-serif;color:#102b38;background:#eef3f5}*{box-sizing:border-box}body{margin:0;background:#eef3f5}header{background:#0b2533;color:#fff;padding:18px 26px;display:flex;justify-content:space-between;align-items:center}header b{font-size:24px}.badge{background:#dff4ef;color:#126e59;padding:8px 12px;border-radius:999px;font-weight:800}
main{padding:24px;max-width:1300px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.head h1{margin:0;font-size:36px}.muted{color:#6b7d87}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:#fff;border:1px solid #d8e1e5;border-radius:18px;padding:18px}.card{cursor:pointer;text-align:left}.card strong{display:block;font-size:28px;color:#1ea4a7}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.secondary{background:#e8eef1}.primary{background:#1ea4a7;color:#fff}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e6ecef;text-align:left}.err{background:#fff0f0;color:#7d1d1d;padding:14px;border-radius:12px}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><div><b>ARCADI GESTIÓ · APPCC / CONTROL NORMATIU</b><div id="centre"></div></div><span class="badge" id="status">VALIDANT</span></header>
<main><div class="head"><div><h1>APPCC / Control Normatiu</h1><div class="muted">Miniapp autònoma del centre</div></div><button class="btn secondary" onclick="location.href='/centre.html'">← Centre</button></div><div id="content"><div class="panel">Carregant...</div></div></main>
<script>
(()=>{'use strict';const SESSION_KEY='arcadi_direction_center_token_v1',params=new URLSearchParams(location.search),incoming=params.get('direction_token')||'',token=incoming||localStorage.getItem('arcadi_center_device_token_v1')||sessionStorage.getItem(SESSION_KEY)||'';if(incoming)sessionStorage.setItem(SESSION_KEY,incoming), $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data=null;
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json','X-Center-Device-Token':token,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Error '+r.status);return d}
async function boot(){try{data=await api('/api/miniapps-center/appcc/bootstrap');$('centre').textContent=data.center?.name||'';$('status').textContent=data.persistent?'AUTORITZAT · PERSISTENT':'AUTORITZAT';home()}catch(e){$('status').textContent='BLOQUEJAT';$('content').innerHTML='<div class="err">'+esc(e.message)+'</div>'}}
function home(){const s=data.state||{};$('content').innerHTML='<div class="grid"><button class="card" onclick="A.list(\'receptions\')"><strong>'+((s.receptions||[]).length)+'</strong><b>Recepció</b><span>Temperatures, lots i conformitat.</span></button><button class="card" onclick="A.list(\'productions\')"><strong>'+((s.productions||[]).length)+'</strong><b>Producció</b><span>Registres APPCC de producció.</span></button><button class="card" onclick="A.list(\'cleaning\')"><strong>'+((s.cleaning||[]).length)+'</strong><b>Neteja</b><span>Controls i freqüències.</span></button><button class="card" onclick="A.list(\'incidents\')"><strong>'+((s.incidents||[]).length)+'</strong><b>Incidències</b><span>Accions correctores.</span></button></div>'}
function list(col){const title={receptions:'Recepció',productions:'Producció',cleaning:'Neteja',incidents:'Incidències'}[col];const rows=data.state?.[col]||[];$('content').innerHTML='<div class="panel"><div class="head"><h2>'+title+'</h2><div><button class="btn secondary" onclick="A.home()">← APPCC</button> <button class="btn primary" onclick="A.add(\''+col+'\')">+ Nou registre</button></div></div><table><thead><tr><th>Data</th><th>Nom</th><th>Lot</th><th>Temp.</th><th>Estat</th><th>Notes</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.date||'')+'</td><td><b>'+esc(x.name||'')+'</b></td><td>'+esc(x.lot||'')+'</td><td>'+esc(x.temperature==null?'':x.temperature)+'</td><td>'+esc(x.status||'')+'</td><td>'+esc(x.notes||'')+'</td></tr>').join('')+'</tbody></table></div>'}
async function add(col){const name=prompt('Nom / concepte');if(!name)return;const lot=prompt('Lot','')||'';const temp=prompt('Temperatura (si aplica)','');const notes=prompt('Notes','')||'';await api('/api/miniapps-center/appcc/'+col,{method:'POST',body:JSON.stringify({name,lot,temperature:temp===''?null:Number(temp),notes,date:new Date().toISOString().slice(0,10),status:'OK'})});await boot();list(col)}
window.A={home,list,add};boot()})();
</script></body></html>
