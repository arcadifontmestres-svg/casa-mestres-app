<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCADI · Reserves</title><style>
:root{font-family:Arial,sans-serif;color:#102b38;background:#eef3f5}*{box-sizing:border-box}body{margin:0;background:#eef3f5}
header{background:#0b2533;color:#fff;padding:18px 26px;display:flex;justify-content:space-between;align-items:center}header b{font-size:24px}.badge{background:#dff4ef;color:#126e59;padding:8px 12px;border-radius:999px;font-weight:800}
main{padding:24px;max-width:1400px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.head h1{margin:0;font-size:36px}.muted{color:#6b7d87}.panel{background:#fff;border:1px solid #d8e1e5;border-radius:18px;padding:18px;margin-bottom:16px}
.tabs,.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#1ea4a7;color:#fff}.secondary{background:#e8eef1;color:#0b2533}.bad{background:#8f2f2f;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5da;border-radius:9px;font-size:15px}label{display:block;font-weight:700;margin-bottom:5px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e5ebee;text-align:left}.zone{display:inline-block;background:#edf4f5;border-radius:999px;padding:7px 10px;margin:4px}.err{background:#fff0f0;color:#7d1d1d;padding:14px;border-radius:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
</style></head><body>
<header><div><b>ARCADI GESTIÓ · RESERVES</b><div id="centreName"></div></div><span id="status" class="badge">VALIDANT</span></header>
<main><div class="head"><div><h1>Reserves / Ocupació</h1><div class="muted">Miniapp autònoma del centre</div></div><button class="btn secondary" onclick="location.href='/centre.html'">← Centre</button></div>
<div class="tabs panel"><button class="btn primary" onclick="R.view('reserves')">Reserves</button><button class="btn secondary" onclick="R.view('new')">+ Nova reserva</button><button class="btn secondary" onclick="R.view('config')">Back Office Reserves</button></div>
<div id="content"><div class="panel">Carregant...</div></div></main>
<script>
(()=>{'use strict';
const token=localStorage.getItem('arcadi_center_device_token_v1')||'', $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state=null;
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json','X-Center-Device-Token':token,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Error '+r.status);return d}
async function boot(){try{state=await api('/api/reserves-center/bootstrap');$('centreName').textContent=state.center?.name||'';$('status').textContent=state.persistent?'AUTORITZAT · PERSISTENT':'AUTORITZAT';renderReservations()}catch(e){$('status').textContent='BLOQUEJAT';$('content').innerHTML='<div class="err">'+esc(e.message)+'</div>'}}
function renderReservations(){const rows=(state.reservations||[]).slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));$('content').innerHTML='<div class="panel"><div class="head"><div><h2>Reserves</h2><div class="muted">'+rows.length+' reserves</div></div></div><table><thead><tr><th>Data</th><th>Hora</th><th>Client</th><th>Pax</th><th>Zona</th><th>Estat</th><th>Pagament</th></tr></thead><tbody>'+(rows.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.time)+'</td><td><b>'+esc(x.name)+'</b></td><td>'+esc(x.pax)+'</td><td>'+esc(zoneName(x.zoneId))+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.paymentStatus||'')+'</td></tr>').join('')||'<tr><td colspan="7">Sense reserves.</td></tr>')+'</tbody></table></div>'}
function zoneName(id){for(const z of state.layout?.zones||[])if(z.id===id)return z.name;return id||'—'}
function newReservation(){
 const zones=state.layout?.zones||[],offers=(state.offers||[]).filter(x=>x.active!==false);
 $('content').innerHTML='<div class="panel"><h2>Nova reserva</h2><form id="f"><div class="grid"><div><label>Data *</label><input id="date" type="date" required></div><div><label>Hora</label><input id="time" type="time"></div><div><label>Nom *</label><input id="name" required></div><div><label>Comensals</label><input id="pax" type="number" min="1" value="2"></div><div><label>Telèfon</label><input id="phone"></div><div><label>Email</label><input id="email" type="email"></div><div><label>Zona</label><select id="zone"><option value="">Sense assignar</option>'+zones.map(z=>'<option value="'+esc(z.id)+'">'+esc(z.name)+'</option>').join('')+'</select></div><div><label>Oferta / menú</label><select id="offer"><option value="">Sense oferta</option>'+offers.map(o=>'<option value="'+esc(o.id)+'">'+esc(o.name)+'</option>').join('')+'</select></div><div style="grid-column:1/-1"><label>Notes</label><textarea id="notes"></textarea></div></div><button class="btn primary" style="margin-top:12px">Guardar reserva</button></form></div>';
 $('f').onsubmit=async e=>{e.preventDefault();await api('/api/reserves-center/reservations',{method:'POST',body:JSON.stringify({date:$('date').value,time:$('time').value,name:$('name').value,pax:$('pax').value,phone:$('phone').value,email:$('email').value,zoneId:$('zone').value,offerId:$('offer').value,notes:$('notes').value})});await boot()}
}
function config(){
 const zones=state.layout?.zones||[],stripe=state.config?.stripe||{};
 $('content').innerHTML='<div class="panel"><h2>Dependència TPV: zones i taules</h2><p class="muted">Reserves llegeix la configuració del TPV del mateix centre; no la duplica.</p><div>'+(zones.map(z=>'<span class="zone">'+esc(z.name)+' · '+((z.tables||[]).length)+' taules</span>').join('')||'Encara no hi ha zones configurades al TPV.')+'</div></div>'+
 '<div class="panel"><h2>Oferta publicada</h2><p class="muted">Menús, carta o promocions publicables per aquesta miniapp.</p><div id="offers">'+((state.offers||[]).map((o,i)=>'<div class="grid" style="margin-bottom:8px"><input data-o="'+i+'" data-k="name" value="'+esc(o.name)+'"><input data-o="'+i+'" data-k="price" type="number" step="0.01" value="'+Number(o.price||0)+'"></div>').join('')||'<div class="muted">Sense oferta publicada.</div>')+'</div><div class="toolbar"><button class="btn secondary" onclick="R.addOffer()">+ Oferta</button><button class="btn primary" onclick="R.saveOffers()">Guardar oferta</button></div></div>'+
 '<div class="panel"><h2>Stripe</h2><p class="muted">Configuració separada de Reserves. No s’activa cobrament real automàticament.</p><div class="grid"><div><label>Mode</label><select id="stripeMode"><option value="disabled" '+((stripe.mode||'disabled')==='disabled'?'selected':'')+'>Desactivat</option><option value="test" '+(stripe.mode==='test'?'selected':'')+'>Proves</option><option value="live" '+(stripe.mode==='live'?'selected':'')+'>Real</option></select></div><div><label><input id="stripeEnabled" type="checkbox" style="width:auto" '+(stripe.enabled?'checked':'')+'> Activat</label></div></div><button class="btn primary" style="margin-top:12px" onclick="R.saveConfig()">Guardar configuració</button></div>';
}
async function saveOffers(){const inputs=[...document.querySelectorAll('[data-o]')];const map=new Map();for(const el of inputs){const i=Number(el.dataset.o);if(!map.has(i))map.set(i,{...(state.offers?.[i]||{}),active:true});map.get(i)[el.dataset.k]=el.dataset.k==='price'?Number(el.value||0):el.value}const items=[...map.values()];await api('/api/reserves-center/offers',{method:'PUT',body:JSON.stringify({items})});await boot();config()}
window.R={view:v=>v==='new'?newReservation():v==='config'?config():renderReservations(),addOffer:()=>{state.offers=state.offers||[];state.offers.push({id:'offer_'+Date.now(),type:'MENU',name:'',price:0,active:true});config()},saveOffers,saveConfig:async()=>{await api('/api/reserves-center/config',{method:'PUT',body:JSON.stringify({stripe:{enabled:$('stripeEnabled').checked,mode:$('stripeMode').value}})});await boot();config()}};
boot();
})();
</script></body></html>
