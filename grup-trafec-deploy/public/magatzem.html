<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCADI · Magatzem</title><style>
:root{font-family:Arial,sans-serif;color:#102b38;background:#eef3f5}*{box-sizing:border-box}body{margin:0;background:#eef3f5}
header{background:#0b2533;color:#fff;padding:18px 26px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header b{font-size:24px}.badge{background:#dff4ef;color:#126e59;padding:8px 12px;border-radius:999px;font-weight:800}
main{padding:28px;max-width:1400px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:24px}.head h1{font-size:38px;margin:0}.head p{margin:6px 0 0;color:#657987}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{background:#fff;border:1px solid #d8e1e5;border-radius:20px;padding:24px;min-height:150px;text-align:left}
.card strong{display:block;font-size:30px;color:#19a4a7;margin-bottom:14px}.card b{display:block;font-size:21px}.card span{display:block;color:#6b7d87;margin-top:9px;line-height:1.35}
.panel{background:#fff;border:1px solid #d8e1e5;border-radius:20px;padding:20px;margin-top:20px}.err{background:#fff3f3;color:#8b1e1e;border:1px solid #e9c7c7;padding:18px;border-radius:16px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #e4eaed}th{font-size:13px;text-transform:uppercase;color:#667985}
button{cursor:pointer;border:0}.back{background:#e8eef1;color:#0b2533;padding:12px 16px;border-radius:12px;font-weight:800}.muted{color:#6b7d87}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
</style></head>
<body><header><div><b>GRUP TRÀFEC · MAGATZEM</b><div id="centreName"></div></div><span class="badge" id="status">VALIDANT</span></header>
<main><div class="head"><div><h1>Magatzem</h1><p>Catàleg mestre de productes compartit. Accés de lectura des dels centres.</p></div><button class="back" onclick="backButton()">← Tornar</button></div>
<div id="content"><div class="panel">Carregant catàleg...</div></div></main><script src="/center-app.js"></script><script>
(async()=>{try{
 const s=await sessionFor('gestio_magatzem');shellTitle('Magatzem',s.center);
 async function load(){
  const out=await api('/api/magatzem-center/bootstrap');
  const items=out.state.products||[];
  const canEdit=out.scope==='direction';
  let stock=null; if(out.scope!=='direction'){try{stock=await api('/api/magatzem-center/stock')}catch(e){stock={error:e.message}}}
  $('content').innerHTML='<div class="panel"><h2>Catàleg mestre · '+items.length+' productes</h2><p class="muted">Aquest catàleg és independent de cada centre. Els registres antics no s\'han importat ni substituït.</p>'+
   (canEdit?'<button class="back" id="addProduct">+ Afegir producte</button>':'')+
   '<table><thead><tr><th>Producte</th><th>Família</th><th>Unitat</th><th>Cost</th></tr></thead><tbody>'+
   items.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.family)+'</td><td>'+esc(x.unit)+'</td><td>'+esc(x.cost)+'</td></tr>').join('')+
   '</tbody></table></div>'+(stock&&!stock.error?'<div class="panel"><h2>Existències del centre</h2><p>Moviments: '+stock.movements.length+'</p><button class="back" id="newReception">+ Recepció de mercaderia</button><table><thead><tr><th>Producte</th><th>Quantitat</th></tr></thead><tbody>'+items.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(stock.quantities[x.id]||0)+' '+esc(x.unit)+'</td></tr>').join('')+'</tbody></table></div>':stock?.error?'<div class="err">'+esc(stock.error)+'</div>':'');
  if(stock&&!stock.error)$('newReception').onclick=async()=>{
   const productId=prompt('Identificador del producte (consulteu el catàleg)','');if(!productId)return;
   const product=items.find(x=>x.id===productId);if(!product){alert('Producte no trobat');return}
   const quantity=Number(prompt('Quantitat rebuda','1'));if(!(quantity>0))return;
   const supplier=prompt('Proveïdor','');if(!supplier)return;
   const lot=prompt('Lot','');if(!lot)return;
   const expiry=prompt('Caducitat (AAAA-MM-DD)','');if(!expiry)return;
   const payload={productId,quantity,supplier,lot,expiry,requestId:crypto.randomUUID()};
   try{await api('/api/magatzem-center/receptions',{method:'POST',body:JSON.stringify(payload)});await load()}
   catch(e){alert(e.message+' — No torneu a registrar la recepció sense comprovar el moviment.')}
  };
  if(canEdit)$('addProduct').onclick=async()=>{
   const name=prompt('Nom del producte');if(!name?.trim())return;
   const unit=prompt('Unitat (kg, l, unitat...)','kg')||'kg';
   const family=prompt('Família','')||'';
   try{await api('/api/magatzem-center/products',{method:'POST',body:JSON.stringify({name,unit,family})});await load()}catch(e){alert(e.message)}
  };
 }
 await load();
}catch(e){blocked(e)}})();
</script></body></html>
