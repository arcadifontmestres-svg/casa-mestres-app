<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TPV · Back Office catàleg</title>
<style>
:root{font-family:Arial,sans-serif;color:#102b38;background:#eef3f5}*{box-sizing:border-box}body{margin:0;background:#eef3f5}
header{background:#0b2533;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:24px}main{max-width:1500px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #d9e1e5;border-radius:18px;padding:18px;margin-bottom:18px}
h1{margin:0}.muted{color:#6c7d87}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:#1ea4a7;color:#fff}.secondary{background:#e8eef1}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #edf1f3;text-align:left;vertical-align:middle}th{font-size:12px;text-transform:uppercase;color:#687a84}
input,select{width:100%;padding:9px;border:1px solid #ccd6db;border-radius:9px}.tiny{width:70px}.check{width:auto}
.zoneChecks{display:flex;gap:8px;flex-wrap:wrap}.zoneChecks label{font-size:13px;white-space:nowrap}.status{margin-left:auto;font-weight:800}
</style></head>
<body>
<header><div><b>TPV · BACK OFFICE / CATÀLEG</b><div id="centreName"></div></div><div id="status">CARREGANT</div></header>
<main>
<div class="panel"><div class="toolbar"><button class="btn secondary" onclick="location.href='/tpv.html'">← Tornar</button><div><h1>Publicació al TPV</h1><div class="muted">Selecciona què apareix al TPV d’aquest centre i com es mostra.</div></div><button class="btn primary" style="margin-left:auto" id="saveBtn">Guardar publicació</button></div></div>
<div class="panel"><div class="toolbar" style="margin-bottom:12px"><button class="btn secondary" onclick="TPVFilter.show('all')">Tot</button><button class="btn secondary" onclick="TPVFilter.show('dish')">Plats</button><button class="btn secondary" onclick="TPVFilter.show('sale')">Begudes / articles de venda</button><button class="btn secondary" onclick="TPVFilter.show('product')">Productes</button><span style="flex:1"></span><select id="bulkZone" style="width:auto;min-width:160px"><option value="">Zona...</option></select><button class="btn secondary" onclick="TPVFilter.zoneVisible(true)">Aplicar zona</button><button class="btn secondary" onclick="TPVFilter.zoneVisible(false)">Treure zona</button><button class="btn secondary" onclick="TPVFilter.selectVisible(true)">Seleccionar tots</button><button class="btn secondary" onclick="TPVFilter.selectVisible(false)">Desmarcar tots</button></div><div id="content">Carregant catàleg...</div></div>
</main>
<script>
(()=>{
'use strict';
const token=sessionStorage.getItem('arcadi_direction_center_token_v1')||localStorage.getItem('arcadi_center_device_token_v1')||'';
let centerId='';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state=null,currentFilter='all';
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json','X-Center-Device-Token':token,...(opt.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Error '+r.status);return d}
function render(){
 $('centreName').textContent=state.center?.name||'';
 const zones=state.tpvConfig?.zones||[];
 $('content').innerHTML='<table><thead><tr><th>Publicar</th><th>Tipus</th><th>Nom botó</th><th>Família</th><th>Preu</th><th>Zones</th><th>Ordre</th></tr></thead><tbody>'+
 state.items.map((x,i)=>{const c=x.config||{};return '<tr data-row="'+i+'" data-type="'+esc(x.sourceType)+'" style="'+(currentFilter==='all'||currentFilter===x.sourceType?'':'display:none')+'"><td><input class="check active" type="checkbox" '+(c.active?'checked':'')+'></td><td>'+(x.sourceType==='dish'?'Plat':x.sourceType==='product'?'Producte':'Beguda / article')+'</td><td><input class="label" value="'+esc(c.label||x.name||'')+'"></td><td><input class="family" value="'+esc(c.family||x.family||'')+'"></td><td><input class="price tiny" type="number" step="0.01" min="0" value="'+Number(c.price??x.price??0)+'"></td><td><div class="zoneChecks">'+(zones.length?zones.map(z=>'<label><input type="checkbox" class="check zone" value="'+esc(z.id)+'" '+((c.zoneIds||[]).includes(z.id)?'checked':'')+'> '+esc(z.name)+'</label>').join(''):'<span class="muted">Configura primer les zones al TPV</span>')+'</div></td><td><input class="sort tiny" type="number" value="'+Number(c.sort||0)+'"></td></tr>'}).join('')+
 '</tbody></table>';
 const bulkZone=document.getElementById('bulkZone');
 if(bulkZone){
   bulkZone.innerHTML='<option value="">Zona...</option>'+(state.tpvConfig?.zones||[]).map(z=>'<option value="'+esc(z.id)+'">'+esc(z.name)+'</option>').join('');
 }
 $('status').textContent='PREPARAT';
}
window.TPVFilter={
 show:type=>{currentFilter=type;render()},
 selectVisible:value=>{
   document.querySelectorAll('tr[data-row]').forEach(tr=>{
     if(tr.style.display==='none') return;
     const cb=tr.querySelector('.active');
     if(cb) cb.checked=value;
   });
 },
 zoneVisible:add=>{
   const zone=document.getElementById('bulkZone')?.value||'';
   if(!zone) return alert('Selecciona una zona.');
   document.querySelectorAll('tr[data-row]').forEach(tr=>{
     if(tr.style.display==='none') return;
     const cb=[...tr.querySelectorAll('.zone')].find(x=>x.value===zone);
     if(cb) cb.checked=add;
   });
 }
};
$('saveBtn').onclick=async()=>{
 try{
  $('status').textContent='GUARDANT...';
  const rows=[...document.querySelectorAll('tr[data-row]')].map((tr,i)=>{const src=state.items[Number(tr.dataset.row)];return {
   sourceType:src.sourceType,sourceId:src.id,active:tr.querySelector('.active').checked,label:tr.querySelector('.label').value.trim(),
   family:tr.querySelector('.family').value.trim(),price:Number(tr.querySelector('.price').value)||0,
   zoneIds:[...tr.querySelectorAll('.zone:checked')].map(x=>x.value),sort:Number(tr.querySelector('.sort').value)||0
  }});
  await api('/api/tpv-center/admin/catalog/'+encodeURIComponent(centerId),{method:'PUT',body:JSON.stringify({items:rows})});
  $('status').textContent='GUARDAT';
 }catch(e){$('status').textContent='ERROR';alert(e.message)}
};
(async()=>{try{const s=await api('/api/govern/center-session');centerId=s.center.id;state=await api('/api/tpv-center/admin/catalog');render()}catch(e){$('content').innerHTML='<div>'+esc(e.message)+'</div>'; $('status').textContent='ERROR'}})();
})();
</script></body></html>
