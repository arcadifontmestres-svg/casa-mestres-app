<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARCADI · TPV BACK</title>
<style>
:root{font-family:Arial,sans-serif;color:#102b38;background:#eef3f5}*{box-sizing:border-box}body{margin:0;background:#eef3f5}
header{background:#0b2533;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}header b{font-size:24px}
main{max-width:1500px;margin:auto;padding:20px}.panel{background:#fff;border:1px solid #d8e1e5;border-radius:18px;padding:18px;margin-bottom:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:#1ea4a7;color:#fff}.secondary{background:#e8eef1}.bad{background:#8f2f2f;color:#fff}
.tabs .active{background:#1ea4a7;color:#fff}.muted{color:#6b7d87}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.wide{grid-column:1/-1}
input,textarea,select{width:100%;padding:11px;border:1px solid #cbd5da;border-radius:10px;font-size:15px}label{display:block;font-weight:700;margin-bottom:5px}
.zone{border:1px solid #d8e1e5;border-radius:14px;padding:14px;margin:10px 0}.tableLine{display:grid;grid-template-columns:1.5fr .7fr .7fr auto;gap:8px;margin-top:8px}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{border:1px solid #d8e1e5;border-radius:14px;padding:14px;background:#fff}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #edf1f3;text-align:left;vertical-align:middle}.check{width:auto}.thumb{width:58px;height:42px;object-fit:cover;border-radius:8px;border:1px solid #ddd}.device{border:1px solid #d8e1e5;border-radius:14px;padding:14px;margin:10px 0}
@media(max-width:850px){.grid2,.grid3,.statgrid{grid-template-columns:1fr}.tableLine{grid-template-columns:1fr 1fr}.tableLine button{grid-column:1/-1}}
</style></head>
<body>
<header><div><b>ARCADI GESTIÓ · TPV BACK</b><div id="centreName"></div></div><div id="status">VALIDANT</div></header>
<main>
<div class="panel toolbar tabs">
 <button class="btn secondary" onclick="location.href='/tpv.html'">← TPV FRONT</button>
 <button class="btn secondary" data-tab="config" onclick="B.tab('config')">CONFIGURACIÓ</button>
 <button class="btn secondary" data-tab="catalog" onclick="B.tab('catalog')">CATÀLEG / BOTONS</button>
 <button class="btn secondary" data-tab="cash" onclick="B.tab('cash')">CAIXA</button>
 <button class="btn secondary" data-tab="sales" onclick="B.tab('sales')">VENDES / TIQUETS</button>
</div>
<div id="content" class="panel">Carregant...</div>
</main>
<script>
(()=>{'use strict';
const TOKEN_KEY='arcadi_center_device_token_v1',SESSION_KEY='arcadi_direction_center_token_v1',params=new URLSearchParams(location.search),incoming=params.get('direction_token')||'',token=incoming||localStorage.getItem(TOKEN_KEY)||sessionStorage.getItem(SESSION_KEY)||'';if(incoming){sessionStorage.setItem(SESSION_KEY,incoming);history.replaceState({},'',location.pathname)}
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>(Number(v)||0).toLocaleString('ca-ES',{style:'currency',currency:'EUR'});
let boot=null,admin=null,tab='config',draftZones=[],extraDevices=[];
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json','X-Center-Device-Token':token,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Error '+r.status);return d}
function uid(p){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function setTab(name){tab=name;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));if(name==='config')renderConfig();if(name==='catalog')loadCatalog();if(name==='cash')renderCash();if(name==='sales')renderSales()}
function renderConfig(){
 const c=boot.config||{},b=c.business||{},p=c.printer||{},kp=c.kitchenPrinter||{},x=c.peripherals||{};
 draftZones=JSON.parse(JSON.stringify(c.zones||[]));extraDevices=JSON.parse(JSON.stringify(x.extraDevices||[]));
 $('content').innerHTML='<h2>Configuració TPV</h2><div class="muted">Aquesta configuració pertany a la miniapp TPV del centre i es desa sense esborrar vincles ni dades existents.</div>'+
 '<h3>Zones i taules</h3><div id="zones"></div><button class="btn secondary" onclick="B.addZone()">+ Zona</button>'+
 '<h3>Dades fiscals i tiquet client</h3><div class="grid2"><div><label>Nom fiscal / comercial</label><input id="bn" value="'+esc(b.name||boot.center?.name||'')+'"></div><div><label>NIF/CIF</label><input id="tax" value="'+esc(b.taxId||'')+'"></div><div class="wide"><label>Adreça</label><input id="addr" value="'+esc(b.address||'')+'"></div><div><label>Telèfon</label><input id="phone" value="'+esc(b.phone||'')+'"></div><div><label>IVA %</label><input id="vat" type="number" step="0.01" value="'+Number(b.vatRate||10)+'"></div><div><label>Logo</label><input id="logo" type="file" accept="image/*"></div><div class="wide"><label>Peu del tiquet</label><textarea id="footer">'+esc(b.receiptFooter||'')+'</textarea></div></div>'+
 '<h3>Impressió</h3><div class="grid3"><div><label>Impressora client</label><input id="printer" value="'+esc(p.printerName||'')+'"></div><div><label>Paper client</label><select id="paper"><option value="80" '+(String(p.paperWidth||'80')==='80'?'selected':'')+'>80 mm</option><option value="58" '+(String(p.paperWidth)==='58'?'selected':'')+'>58 mm</option></select></div><div><label><input class="check" id="auto" type="checkbox" '+(p.autoPrint?'checked':'')+'> Autoimpressió client</label></div><div><label>Impressora cuina</label><input id="kprinter" value="'+esc(kp.printerName||'')+'"></div><div><label>Paper cuina</label><select id="kpaper"><option value="80" '+(String(kp.paperWidth||'80')==='80'?'selected':'')+'>80 mm</option><option value="58" '+(String(kp.paperWidth)==='58'?'selected':'')+'>58 mm</option></select></div><div><label><input class="check" id="kauto" type="checkbox" '+(kp.autoPrint===false?'':'checked')+'> Autoimpressió cuina</label></div></div>'+
 '<h3>Perifèrics</h3>'+deviceBlock('cashDrawer','Calaix de caixa',x.cashDrawer||{},false)+deviceBlock('paymentTerminal','Terminal de pagament / TPV bancari',x.paymentTerminal||{},true)+deviceBlock('automaticCash','Caixa automàtica de cobrament',x.automaticCash||{},true)+deviceBlock('barcodeScanner','Lector de codis de barres',x.barcodeScanner||{},false)+
 '<div class="device"><div class="toolbar"><b>Altres perifèrics</b><button class="btn secondary" onclick="B.addDevice()">+ Afegir dispositiu</button></div><div id="extraDevices"></div></div>'+
 '<div class="toolbar"><button class="btn primary" onclick="B.saveConfig()">GUARDAR CONFIGURACIÓ TPV</button></div>';
 drawZones();drawExtras();
}
function deviceBlock(key,title,d,provider){
 return '<div class="device"><div class="grid3"><div><label><input class="check" id="'+key+'_enabled" type="checkbox" '+(d.enabled?'checked':'')+'> '+esc(title)+'</label></div><div><label>Connexió</label><select id="'+key+'_connection">'+['usb','network','serial','bluetooth','printer','keyboard','cloud'].map(v=>'<option value="'+v+'" '+(d.connection===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div><div><label>Dispositiu / IP / port / nom</label><input id="'+key+'_device" value="'+esc(d.device||'')+'"></div>'+(provider?'<div><label>Proveïdor / model</label><input id="'+key+'_provider" value="'+esc(d.provider||'')+'"></div>':'')+'</div></div>';
}
function drawZones(){
 $('zones').innerHTML=draftZones.map((z,zi)=>'<div class="zone"><div class="toolbar"><input style="flex:1" value="'+esc(z.name)+'" oninput="B.zoneName('+zi+',this.value)"><button class="btn bad" onclick="B.delZone('+zi+')">Eliminar zona</button></div>'+(z.tables||[]).map((t,ti)=>'<div class="tableLine"><input value="'+esc(t.name)+'" oninput="B.tableName('+zi+','+ti+',this.value)"><input type="number" min="1" value="'+Number(t.min||1)+'" oninput="B.tableMin('+zi+','+ti+',this.value)"><input type="number" min="1" value="'+Number(t.max||1)+'" oninput="B.tableMax('+zi+','+ti+',this.value)"><button class="btn bad" onclick="B.delTable('+zi+','+ti+')">Eliminar</button></div>').join('')+'<button class="btn secondary" style="margin-top:8px" onclick="B.addTable('+zi+')">+ Taula</button></div>').join('');
}
function drawExtras(){
 const box=$('extraDevices');if(!box)return;
 box.innerHTML=extraDevices.map((d,i)=>'<div class="grid3" style="margin-top:10px"><div><label>Nom</label><input value="'+esc(d.name||'')+'" oninput="B.ex('+i+',\'name\',this.value)"></div><div><label>Tipus</label><input value="'+esc(d.type||'')+'" oninput="B.ex('+i+',\'type\',this.value)"></div><div><label>Connexió</label><input value="'+esc(d.connection||'')+'" oninput="B.ex('+i+',\'connection\',this.value)"></div><div><label>Dispositiu / IP / port</label><input value="'+esc(d.device||'')+'" oninput="B.ex('+i+',\'device\',this.value)"></div><div><label><input class="check" type="checkbox" '+(d.enabled===false?'':'checked')+' onchange="B.ex('+i+',\'enabled\',this.checked)"> Actiu</label></div><div><button class="btn bad" onclick="B.delDevice('+i+')">Eliminar</button></div></div>').join('')||'<div class="muted">Cap dispositiu addicional.</div>';
}
async function saveConfig(){
 $('status').textContent='GUARDANT...';
 const c=boot.config||{},oldLogo=c.business?.logo||'';let logo=oldLogo;const file=$('logo')?.files?.[0];if(file)logo=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result||''));r.onerror=no;r.readAsDataURL(file)});
 const peripheral=(key,provider=false)=>({enabled:$(key+'_enabled').checked,connection:$(key+'_connection').value,device:$(key+'_device').value.trim(),...(provider?{provider:$(key+'_provider').value.trim()}:{})});
 const saved=await api('/api/tpv-center/config',{method:'PUT',body:JSON.stringify({
  zones:draftZones,
  business:{name:$('bn').value.trim(),taxId:$('tax').value.trim(),address:$('addr').value.trim(),phone:$('phone').value.trim(),vatRate:Number($('vat').value||10),logo,receiptFooter:$('footer').value.trim()},
  printer:{printerName:$('printer').value.trim(),paperWidth:$('paper').value,autoPrint:$('auto').checked},
  kitchenPrinter:{printerName:$('kprinter').value.trim(),paperWidth:$('kpaper').value,autoPrint:$('kauto').checked},
  peripherals:{cashDrawer:peripheral('cashDrawer'),paymentTerminal:peripheral('paymentTerminal',true),automaticCash:peripheral('automaticCash',true),barcodeScanner:{...peripheral('barcodeScanner'),mode:'keyboard'},extraDevices}
 })});
 boot.config=saved;$('status').textContent='GUARDAT';
}
async function loadCatalog(){
 $('content').innerHTML='Carregant catàleg...';admin=await api('/api/tpv-center/admin/catalog');renderCatalog();
}
function renderCatalog(){
 const zones=admin.tpvConfig?.zones||[];
 $('content').innerHTML='<div class="toolbar"><h2 style="margin-right:auto">Catàleg / botons TPV</h2><button class="btn primary" onclick="B.saveCatalog()">Guardar catàleg</button></div><div class="muted">Publica plats, begudes i articles. Pots posar foto, color, família, preu i zones.</div><div style="overflow:auto"><table><thead><tr><th>Publicar</th><th>Tipus</th><th>Nom</th><th>Família</th><th>Preu</th><th>Foto/color</th><th>Zones</th><th>Ordre</th></tr></thead><tbody>'+admin.items.map((x,i)=>{const c=x.config||{};return '<tr data-catalog="'+i+'"><td><input class="check active" type="checkbox" '+(c.active?'checked':'')+'></td><td>'+esc(x.sourceType)+'</td><td><input class="label" value="'+esc(c.label||x.name||'')+'"></td><td><input class="family" value="'+esc(c.family||x.family||'')+'"></td><td><input class="price" type="number" step="0.01" value="'+Number(c.price??x.price??0)+'"></td><td><img class="thumb preview" src="'+esc(c.image||x.image||'')+'"><input class="imgval" type="hidden" value="'+esc(c.image||x.image||'')+'"><input class="imgfile" type="file" accept="image/*"><input class="color" type="color" value="'+esc(c.buttonColor||'#ffffff')+'"></td><td>'+zones.map(z=>'<label style="white-space:nowrap"><input class="check zoneCheck" type="checkbox" value="'+esc(z.id)+'" '+((c.zoneIds||[]).includes(z.id)?'checked':'')+'> '+esc(z.name)+'</label>').join('<br>')+'</td><td><input class="sort" type="number" value="'+Number(c.sort||0)+'"></td></tr>'}).join('')+'</tbody></table></div>';
 document.querySelectorAll('[data-catalog]').forEach(tr=>{const f=tr.querySelector('.imgfile'),v=tr.querySelector('.imgval'),p=tr.querySelector('.preview');f.onchange=()=>{const file=f.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{v.value=String(r.result||'');p.src=v.value};r.readAsDataURL(file)}});
}
async function saveCatalog(){
 const items=[...document.querySelectorAll('[data-catalog]')].map(tr=>{const src=admin.items[Number(tr.dataset.catalog)];return{sourceType:src.sourceType,sourceId:src.id,active:tr.querySelector('.active').checked,label:tr.querySelector('.label').value.trim(),family:tr.querySelector('.family').value.trim(),price:Number(tr.querySelector('.price').value)||0,zoneIds:[...tr.querySelectorAll('.zoneCheck:checked')].map(x=>x.value),sort:Number(tr.querySelector('.sort').value)||0,image:tr.querySelector('.imgval').value||'',buttonColor:tr.querySelector('.color').value||''}});
 await api('/api/tpv-center/admin/catalog/'+encodeURIComponent(boot.center.id),{method:'PUT',body:JSON.stringify({items})});$('status').textContent='CATÀLEG GUARDAT';
}
async function renderCash(){const d=await api('/api/tpv-center/backoffice');const o=d.openCash;$('content').innerHTML='<h2>Caixa</h2><div class="statgrid"><div class="stat"><b>Estat</b><div>'+(o?'OBERTA':'TANCADA')+'</div></div><div class="stat"><b>Fons inicial</b><div>'+money(o?.openingAmount||0)+'</div></div><div class="stat"><b>Venda sessió</b><div>'+money((d.summary||{}).total||0)+'</div></div><div class="stat"><b>Tiquets</b><div>'+Number((d.summary||{}).ticketCount||0)+'</div></div></div><div class="toolbar" style="margin-top:14px"><button class="btn primary" onclick="B.openCash()">OBRIR CAIXA</button><button class="btn bad" onclick="B.closeCash()">TANCAR CAIXA</button></div>'}
async function renderSales(from='',to=''){const q=new URLSearchParams();if(from)q.set('from',from);if(to)q.set('to',to);const d=await api('/api/tpv-center/backoffice'+(q.toString()?'?'+q:''));const s=d.summary||{};$('content').innerHTML='<h2>Vendes / tiquets</h2><div class="grid2"><div><label>Des de</label><input id="from" type="date" value="'+esc(from)+'"></div><div><label>Fins</label><input id="to" type="date" value="'+esc(to)+'"></div></div><button class="btn secondary" style="margin-top:10px" onclick="B.filterSales()">Filtrar</button><div class="statgrid" style="margin-top:14px"><div class="stat"><b>Total</b><div>'+money(s.total||0)+'</div></div><div class="stat"><b>Tiquets</b><div>'+Number(s.ticketCount||0)+'</div></div><div class="stat"><b>Tiquet mitjà</b><div>'+money(s.averageTicket||0)+'</div></div><div class="stat"><b>Efectiu</b><div>'+money(s.byPayment?.EFECTIU||0)+'</div></div></div><div style="overflow:auto;margin-top:16px"><table><thead><tr><th>Data</th><th>Tiquet</th><th>Taula</th><th>Pax</th><th>Pagament</th><th>Total</th></tr></thead><tbody>'+((d.tickets||[]).slice().reverse().map(t=>'<tr><td>'+esc(new Date(t.createdAt).toLocaleString('ca-ES'))+'</td><td><b>'+esc(t.number)+'</b></td><td>'+esc(t.tableName||'')+'</td><td>'+esc(t.pax||'')+'</td><td>'+esc(t.paymentMethod||'')+'</td><td>'+money(t.total)+'</td></tr>').join('')||'<tr><td colspan="6">Sense tiquets.</td></tr>')+'</tbody></table></div>'}
window.B={tab:setTab,saveConfig,saveCatalog,addZone:()=>{draftZones.push({id:uid('zone'),name:'Nova zona',tables:[]});drawZones()},delZone:i=>{draftZones.splice(i,1);drawZones()},zoneName:(i,v)=>draftZones[i].name=v,addTable:i=>{draftZones[i].tables=draftZones[i].tables||[];draftZones[i].tables.push({id:uid('table'),name:'Nova taula',min:1,max:2});drawZones()},delTable:(i,j)=>{draftZones[i].tables.splice(j,1);drawZones()},tableName:(i,j,v)=>draftZones[i].tables[j].name=v,tableMin:(i,j,v)=>draftZones[i].tables[j].min=Math.max(1,Number(v)||1),tableMax:(i,j,v)=>draftZones[i].tables[j].max=Math.max(1,Number(v)||1),addDevice:()=>{extraDevices.push({id:uid('dev'),name:'',type:'',connection:'',device:'',enabled:true});drawExtras()},delDevice:i=>{extraDevices.splice(i,1);drawExtras()},ex:(i,k,v)=>extraDevices[i][k]=v,openCash:async()=>{const a=Number(prompt('Fons inicial','0')||0);await api('/api/tpv-center/cash/open',{method:'POST',body:JSON.stringify({openingAmount:a})});renderCash()},closeCash:async()=>{const a=Number(prompt('Import comptat','0')||0);const d=await api('/api/tpv-center/cash/close',{method:'POST',body:JSON.stringify({closingAmount:a})});alert('Diferència: '+money(d.cashDifference||0));renderCash()},filterSales:()=>renderSales($('from').value,$('to').value)};
(async()=>{try{boot=await api('/api/tpv-center/bootstrap');$('centreName').textContent=boot.center?.name||'';$('status').textContent=boot.persistent?'PERSISTENT':'ACTIU';setTab('config')}catch(e){$('status').textContent='ERROR';$('content').innerHTML='<div>'+esc(e.message)+'</div>'}})();
})();
</script></body></html>
