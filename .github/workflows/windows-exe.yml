name: Crear executable Windows

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'windows-*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar el projecte únic
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instal·lar dependències
        run: npm install
      - name: Comprovar el codi
        run: npm run check
      - name: Executar proves
        run: npm test
      - name: Crear ARCADI_GESTIO_RESTAURANT.exe
        run: npm run build:windows
      - name: Guardar executable
        uses: actions/upload-artifact@v4
        with:
          name: ARCADI_GESTIO_RESTAURANT_Windows
          path: dist-windows/ARCADI_GESTIO_RESTAURANT.exe
          if-no-files-found: error
